name: Release Python Wheel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # One PyPI project, `play_launch`, with one wheel per wheel tag (phase 92).
  # The binaries link one ROS distribution's libraries and Python, and no
  # wheel tag tells Jazzy from Kilted (both Ubuntu 24.04, Python 3.12) or
  # Lyrical from Rolling (both 26.04, Python 3.14). So each matrix row builds
  # one distribution's PAYLOAD (play_launch/dist/<distro>/) in that
  # distribution's container, assemble-wheels merges the rows that share a
  # tag into one wheel, and play_launch/payload.py picks the payload at run
  # time. pip picks the wheel by Python, glibc and CPU, as for any binary
  # wheel.
  #
  # A new distribution is one more matrix row here and in smoke-test, plus
  # its Python in payload.py's DISTRO_PYTHON: rcl_interception_sys generates
  # its struct layouts from the distribution's headers.
  build-wheel:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        ros: [humble, jazzy, kilted, lyrical, rolling]
        # Rolling follows the newest Ubuntu LTS: when it moves, its row moves
        # with it (its old-platform packages stop updating but stay
        # installable, so a stale row still builds, against a stale Rolling).
        include:
          - {ros: humble, ubuntu: "22.04", codename: jammy, glibc: "2_35", python: cp310}
          - {ros: jazzy, ubuntu: "24.04", codename: noble, glibc: "2_39", python: cp312}
          - {ros: kilted, ubuntu: "24.04", codename: noble, glibc: "2_39", python: cp312}
          - {ros: lyrical, ubuntu: "26.04", codename: resolute, glibc: "2_43", python: cp314}
          # Rolling on 26.04 is only in ros2-testing so far (as in the
          # official ros:rolling image); ros2 still carries Lyrical alone.
          - {ros: rolling, ubuntu: "26.04", codename: resolute, glibc: "2_43", python: cp314, repo: ros2-testing}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up QEMU (for arm64)
      if: matrix.arch == 'arm64'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Build Python wheel (${{ matrix.ros }}, ${{ matrix.arch }})
      run: |
        # Get version from tag or pyproject.toml
        if [ -n "${GITHUB_REF#refs/tags/v}" ] && [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        else
          VERSION=$(grep -m1 'version = ' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
        fi
        echo "Building version $VERSION for ${{ matrix.ros }} on ${{ matrix.arch }}"
        ROS=${{ matrix.ros }}
        PYTAG=${{ matrix.python }}
        # Taken before the sed below dirties the tree; build.rs embeds it in
        # `play_launch --version`.
        DESCRIBE=$(git describe --tags --always --dirty)
        # Set up architecture-specific variables
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          DOCKER_ARCH="linux/arm64"
          DEB_ARCH="arm64"
          WHEEL_PLATFORM="manylinux_${{ matrix.glibc }}_aarch64"
        else
          DOCKER_ARCH="linux/amd64"
          DEB_ARCH="amd64"
          WHEEL_PLATFORM="manylinux_${{ matrix.glibc }}_x86_64"
        fi

        # Build in a fresh Ubuntu container to ensure correct
        # native libraries for each architecture (avoids QEMU/multi-arch
        # issues with pre-built Docker images).
        docker run --rm --platform=${DOCKER_ARCH} \
          -e PLAY_LAUNCH_GIT_DESCRIBE="$DESCRIBE" \
          -v $PWD:/workspace \
          -w /workspace \
          ubuntu:${{ matrix.ubuntu }} \
          bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive

            # Under QEMU, a package's maintainer script (libc-bin's ldconfig)
            # now and then segfaults (exit 139) and fails the whole job.
            # Finish the configuration and try again.
            apt_install() {
              for attempt in 1 2 3; do
                apt-get install -y \"\$@\" && return 0
                echo \"apt-get install failed (attempt \$attempt); retrying\" >&2
                dpkg --configure -a || true
              done
              return 1
            }

            apt-get update
            apt_install software-properties-common curl git build-essential pkg-config ca-certificates

            # Add ROS 2 repository
            curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
              -o /usr/share/keyrings/ros-archive-keyring.gpg
            echo \"deb [arch=${DEB_ARCH} signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/${{ matrix.repo || 'ros2' }}/ubuntu ${{ matrix.codename }} main\" \
              > /etc/apt/sources.list.d/ros2.list

            apt-get update
            apt_install \
              python3-pip python3-dev python3-venv python3-colcon-common-extensions \
              ros-${ROS}-ros-core \
              ros-${ROS}-ament-index-python \
              ros-${ROS}-launch \
              ros-${ROS}-rcl \
              ros-${ROS}-rcutils \
              ros-${ROS}-rmw \
              ros-${ROS}-rosidl-typesupport-c \
              ros-${ROS}-composition-interfaces \
              ros-${ROS}-rcl-interfaces \
              ros-${ROS}-builtin-interfaces \
              ros-${ROS}-action-msgs \
              ros-${ROS}-unique-identifier-msgs \
              ros-${ROS}-rosgraph-msgs \
              ros-${ROS}-example-interfaces \
              ros-${ROS}-test-msgs \
              ros-${ROS}-rclcpp-components \
              ros-${ROS}-class-loader \
              ros-${ROS}-ament-index-cpp \
              libclang-dev \
              libz3-dev

            # Install Rust
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source ~/.cargo/env

            # Install Python build tools
            # 24.04 marks the system Python as externally managed (PEP 668)
            export PIP_BREAK_SYSTEM_PACKAGES=1
            pip3 install 'colcon-cargo-ros2==0.5.1' 'cargo-ament-build>=0.1.11' build 'wheel>=0.40' uv
            # State the toolchain rather than assume it. This pin used to be
            # >=0.4.0, so CI silently tracked whatever PyPI served that day and
            # could differ from any developer machine with no commit to show it.
            python3 -c \"import importlib.metadata as m; print('colcon-cargo-ros2', m.version('colcon-cargo-ros2'))\"

            # Install just: a pinned GitHub release, retried. The just.systems
            # installer queries the GitHub API and is rate-limited (403).
            JUST_VERSION=1.40.0
            curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors \
              https://github.com/casey/just/releases/download/\${JUST_VERSION}/just-\${JUST_VERSION}-\$(uname -m)-unknown-linux-musl.tar.gz \
              | tar -xz -C /usr/local/bin just
            just --version

            # Build
            source /opt/ros/${ROS}/setup.bash
            just build
            for whl in dist/*.whl; do
              python3 -m wheel tags --python-tag=${PYTAG} --platform-tag=${WHEEL_PLATFORM} --remove \"\$whl\"
            done
            ls -lh dist/
            chown -R \$(stat -c '%u:%g' /workspace) dist/ build/ install/ || true
          "

        ls -lh dist/

    # One payload per row. Rows of one tag build wheels of the same file
    # name, so each is its own artifact, merged by assemble-wheels.
    - name: Upload the row's wheel
      uses: actions/upload-artifact@v5
      with:
        name: row-${{ matrix.ros }}-${{ matrix.arch }}
        path: dist/*.whl
        retention-days: 7

  # Merge the rows that share a wheel tag: six wheels, one per
  # (Python, glibc, CPU), each carrying every distribution that tag serves.
  # Refuses a missing or doubled distribution, and a shared file that
  # differs between the rows of one tag.
  assemble-wheels:
    needs: build-wheel
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - name: Check the tag against pyproject
      run: |
        VERSION=$(grep -m1 '^version = ' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
        if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ] && [ "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]; then
          echo "tag ${GITHUB_REF#refs/tags/} does not match pyproject version $VERSION" >&2
          exit 1
        fi
    - name: Download the rows
      uses: actions/download-artifact@v5
      with:
        pattern: row-*
        path: rows
    - name: Assemble
      run: |
        python3 scripts/assemble_wheels.py rows wheels \
          --expect humble,jazzy,kilted,lyrical,rolling
        ls -lh wheels/
    - uses: actions/upload-artifact@v5
      with:
        name: wheels
        path: wheels/*.whl
        retention-days: 7

  # Install each assembled wheel in each distribution's own container and
  # run every payload it carries (scripts/smoke_wheel.sh).
  smoke-test:
    needs: assemble-wheels
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        ros: [humble, jazzy, kilted, lyrical, rolling]
        include:
          - {ros: humble, ubuntu: "22.04", codename: jammy, glibc: "2_35", python: cp310}
          - {ros: jazzy, ubuntu: "24.04", codename: noble, glibc: "2_39", python: cp312}
          - {ros: kilted, ubuntu: "24.04", codename: noble, glibc: "2_39", python: cp312}
          - {ros: lyrical, ubuntu: "26.04", codename: resolute, glibc: "2_43", python: cp314}
          - {ros: rolling, ubuntu: "26.04", codename: resolute, glibc: "2_43", python: cp314, repo: ros2-testing}
    steps:
    - uses: actions/checkout@v5
    - name: Set up QEMU (for arm64)
      if: matrix.arch == 'arm64'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    - uses: actions/download-artifact@v5
      with:
        name: wheels
        path: wheels
    - name: Smoke test (${{ matrix.ros }}, ${{ matrix.arch }})
      run: |
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          DOCKER_ARCH=linux/arm64; DEB_ARCH=arm64; CPU=aarch64
        else
          DOCKER_ARCH=linux/amd64; DEB_ARCH=amd64; CPU=x86_64
        fi
        WHEEL=$(ls wheels/play_launch-*-${{ matrix.python }}-*-manylinux_${{ matrix.glibc }}_${CPU}.whl)
        echo "Testing $WHEEL"
        docker run --rm --platform=${DOCKER_ARCH} \
          -v $PWD:/workspace -w /workspace \
          -e SMOKE_STARTUP_WAIT=600 \
          ubuntu:${{ matrix.ubuntu }} \
          bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt_install() {
              for attempt in 1 2 3; do
                apt-get install -y \"\$@\" && return 0
                dpkg --configure -a || true
              done
              return 1
            }
            apt-get update
            apt_install curl ca-certificates python3-pip
            curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
              -o /usr/share/keyrings/ros-archive-keyring.gpg
            echo \"deb [arch=${DEB_ARCH} signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/${{ matrix.repo || 'ros2' }}/ubuntu ${{ matrix.codename }} main\" \
              > /etc/apt/sources.list.d/ros2.list
            apt-get update
            apt_install ros-${{ matrix.ros }}-ros-core \
              ros-${{ matrix.ros }}-demo-nodes-cpp \
              ros-${{ matrix.ros }}-composition \
              ros-${{ matrix.ros }}-rclcpp-components
            export PIP_BREAK_SYSTEM_PACKAGES=1
            pip3 install $WHEEL
            scripts/smoke_wheel.sh ${{ matrix.ros }} /tmp/smoke
          "

  release:
    needs: [assemble-wheels, smoke-test]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # Required for creating releases

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download the wheels
      uses: actions/download-artifact@v5
      with:
        name: wheels
        path: release-assets

    - name: Show release assets
      run: ls -lh release-assets/

    - name: Extract version
      id: version
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Upload wheels to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*.whl
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    needs: [assemble-wheels, smoke-test]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
    - name: Download the wheels
      uses: actions/download-artifact@v5
      with:
        name: wheels
        path: dist

    - name: Show wheels to publish
      run: ls -lh dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
