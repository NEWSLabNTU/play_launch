name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # RFC-0060 layer-2 isolation. Deliberately NOT in the builder container: this
  # runs on a bare runner with no ROS installed anywhere, so it proves the
  # property rather than simulating it by unsetting variables. The gate script
  # strips the environment too, which is what makes it useful locally; here
  # there is nothing to strip.
  layer2-isolation:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Confirm the runner really has no ROS
      run: |
        if command -v ros2 >/dev/null 2>&1 || [ -d /opt/ros ]; then
          echo "This runner has ROS -- the job would prove nothing. Failing loudly."
          exit 1
        fi
        echo "No ROS on this runner."

    - name: Layer-2 isolation gate
      run: ./src/ros-launch-resolve/scripts/check-layer2-isolation.sh

  build-and-test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/newslabntu/play-launch-builder:humble
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Ensure build tools
      run: pip3 install 'colcon-cargo-ros2>=0.4.0'

    - name: Build workspace
      run: |
        source /opt/ros/humble/setup.bash
        just build
        pip3 install --no-deps dist/*.whl

    - name: Run tests
      run: |
        source /opt/ros/humble/setup.bash
        source install/setup.bash
        just test

    - name: Ensure Node.js
      # `just check` now runs the web UI lint + typecheck. The builder image
      # gained nodejs in the same commit, but CI pulls a PUBLISHED tag — this
      # bootstraps until an image built from that Dockerfile is pushed, and is
      # a no-op afterwards.
      run: |
        if ! command -v node >/dev/null 2>&1; then
          apt-get update && apt-get install -y --no-install-recommends nodejs npm
        fi
        node --version && npm --version

    - name: Run checks
      run: just check
