name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # RFC-0060 layer-2 isolation. Deliberately NOT in the builder container: this
  # runs on a bare runner with no ROS installed anywhere, so it proves the
  # property rather than simulating it by unsetting variables. The gate script
  # strips the environment too, which is what makes it useful locally; here
  # there is nothing to strip.
  layer2-isolation:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Confirm the runner really has no ROS
      run: |
        if command -v ros2 >/dev/null 2>&1 || [ -d /opt/ros ]; then
          echo "This runner has ROS -- the job would prove nothing. Failing loudly."
          exit 1
        fi
        echo "No ROS on this runner."

    - name: Layer-2 isolation gate
      run: ./src/ros-launch-resolve/scripts/check-layer2-isolation.sh

  build-and-test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/newslabntu/play-launch-builder:humble
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Ensure build tools
      run: |
        pip3 install 'colcon-cargo-ros2==0.5.1'
        python3 -c "import importlib.metadata as m; print('colcon-cargo-ros2', m.version('colcon-cargo-ros2'))"

    - name: Build workspace
      run: |
        source /opt/ros/humble/setup.bash
        just build
        pip3 install --no-deps dist/*.whl

    - name: Run tests
      run: |
        source /opt/ros/humble/setup.bash
        source install/setup.bash
        just test

    # The cross-parser parity gates. `just test-all` runs them, but CI runs
    # `just test` (the fast suite), so until now nothing ran them
    # automatically — they only ever ran when someone remembered. In that
    # state one of them found #0021: the Rust parser gave a composable node
    # the CONTAINER's namespace where ROS 2 gives it the launch context's,
    # which had changed the RUNNING topology of a 144-node stack and survived
    # every automated check in this repo.
    #
    # Run separately from `just test` rather than by switching CI to
    # `test-all`, because the parity gates cost seconds while the full
    # integration suite costs minutes, and the Autoware gate self-skips here
    # (no Autoware install on the runner) with a visible SKIP line.
    - name: Cross-parser parity gates
      run: |
        source /opt/ros/humble/setup.bash
        source install/setup.bash
        just test-parity

    - name: Set up Node.js
      # `just check` runs the web UI lint + typecheck. Pinned via setup-node
      # rather than apt: Ubuntu 22.04 ships Node 12, on which the modern
      # tooling dies with `SyntaxError: Unexpected token '('` inside its own
      # minified dependencies. The builder image installs Node from NodeSource
      # for the same reason; this step makes CI independent of which image tag
      # happens to be published.
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Report Node version
      run: node --version && npm --version

    - name: Cache web UI dependencies
      uses: actions/cache@v4
      with:
        path: node_modules
        # No restore-keys on purpose: a node_modules tree restored for a
        # DIFFERENT lockfile is worse than no cache at all, because the stale
        # transitive deps it contains are exactly what a lint run would then
        # be testing. Miss cleanly and let `npm ci` rebuild it.
        key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

    - name: Run checks
      run: just check
