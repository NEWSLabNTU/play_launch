[package]
name = "play-launch-tests"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace, explicitly. The root manifest's `exclude = ["tests"]`
# keeps this crate out of the play_launch graph, but cargo keeps walking UP
# past a workspace that excludes it, so from a checkout nested inside another
# clone (a `git worktree` under `.claude/worktrees/`) it found the OUTER
# clone's root manifest and refused with "current package believes it's in a
# workspace when it's not". Same rule as `src/spsc_shm` and
# `src/ros-launch-resolve`: a standalone crate declares itself one.
[workspace]

[lib]
path = "src/lib.rs"

# Integration test binaries
[[test]]
name = "simple_workspace"
path = "tests/simple_workspace.rs"

[[test]]
name = "autoware"
path = "tests/autoware.rs"

[[test]]
name = "sequential_loading"
path = "tests/sequential_loading.rs"

[[test]]
name = "concurrent_loading"
path = "tests/concurrent_loading.rs"

[[test]]
name = "mixed_loading"
path = "tests/mixed_loading.rs"

[[test]]
name = "io_stress"
path = "tests/io_stress.rs"

[[test]]
name = "container_events"
path = "tests/container_events.rs"

[[test]]
name = "control_channel"
path = "tests/control_channel.rs"

[[test]]
name = "load_policy"
path = "tests/load_policy.rs"

[[test]]
name = "run_log"
path = "tests/run_log.rs"

[[test]]
name = "startup_shortfall"
path = "tests/startup_shortfall.rs"

[[test]]
name = "parallel_loading"
path = "tests/parallel_loading.rs"

[[test]]
name = "interception"
path = "tests/interception.rs"

[[test]]
name = "manifest_check"
path = "tests/manifest_check.rs"

[[test]]
name = "sched_apply"
path = "tests/sched_apply.rs"

[[test]]
name = "rt_workspace"
path = "tests/rt_workspace.rs"

[[test]]
name = "contract_eject"
path = "tests/contract_eject.rs"

[dependencies]
libc = "0.2"
# `testdata` exposes `fixture_dir()`. `manifest_check.rs` drives the CLI
# against the manifest repository's checker fixtures; phase-55 W2 made that a
# git dependency, so only the owning crate can name their path.
ros-launch-manifest-check = { git = "https://github.com/NEWSLabNTU/ros-launch-manifest.git", tag = "v0.1.35", features = ["testdata"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
which = "6"
