# Phase 91 E5: contract_ext_uav with descent.rlx as extension-examples.md
# section 4 first writes it, before the author adds the domain its worst-case
# claims need: every claim is refuted, each with the domain that would make
# it hold. contract_ext_uav carries the file with that domain added.
#
# Phase 91 E4: extension-examples.md section 4 on contract_fault's chain.
# uav.descent derives the settle: (120 - 10) m / 3 m/s + 10 m / 0.7 m/s =
# 50.95s, so reaction_total = 100 + 7 + 50952.38 = 51059.38ms, inside the
# 120s ftti, and the energy check passes: 600 W * 51.06 s = 8.51 Wh <=
# 222 Wh * (0.30 - 0.22) = 17.76 Wh. The settle's parameters are the
# brake_controller's (the safe state's node); the hazard's fractions are
# the lidar_driver's (the guard's publisher).
version: 1
use: { uav.descent: "^0.2" }

hazards:
  drive_blind:
    severity: ASIL_D
    description: vehicle continues with no obstacle data
    guards: [/safety/scan]
    on: omission
    ftti: 120s
    reaction: safety.stop
    max_altitude: 120 m
    hover_power: 600 W
    battery_capacity: 222 Wh
    trigger_soc: low_battery_fraction
    reserve_soc: reserve_fraction

nodes:
  lidar_driver:
    pub:
      scan: {}
    paths:
      sample:
        trigger: { timer: { rate_hz: 50 } }
        output: [scan]
        max_latency: 2ms

  obstacle_detector:
    sub:
      scan:
        min_rate_hz: 50
        qos: { liveliness: manual_by_topic, lease_duration: 100ms }
        on_violation:
          on: [omission]
          reaction: declare_lost
          within: 10ms
    pub:
      obstacles: {}
    paths:
      detect:
        trigger: { input: [scan] }
        output: [obstacles]
        max_latency: 12ms
      declare_lost:
        trigger: { input: [scan] }
        output: [obstacles]
        max_latency: 2ms

  brake_controller:
    sub:
      obstacles:
        max_age: 60ms
        on_violation:
          on: [late, omission]
          reaction: emergency_stop
          within: 20ms
    pub:
      brake_cmd: {}
    paths:
      brake:
        trigger: { input: [obstacles] }
        output: [brake_cmd]
        max_latency: 8ms
      emergency_stop:
        trigger: { input: [obstacles] }
        output: [brake_cmd]
        max_latency: 5ms
        safe_state:
          emits: brake_cmd
          settle:
            descent_speed: descent_speed
            slow_altitude: slow_altitude
            land_speed: land_speed

paths:
  safety.stop:
    trigger: { input: [/safety/scan] }
    output: [/safety/brake_cmd]
    max_latency: 100ms

topics:
  /safety/scan:
    type: std_msgs/msg/String
    pub: [lidar_driver/scan]
    sub: [obstacle_detector/scan]
  /safety/obstacles:
    type: std_msgs/msg/String
    pub: [obstacle_detector/obstacles]
    sub: [brake_controller/obstacles]
  /safety/brake_cmd:
    type: std_msgs/msg/String
    external: sub
    pub: [brake_controller/brake_cmd]
