# Phase 100 F5: the protective field of `contract_safe_ros_fixed`, checked by
# the `mobile.protective_stop` reference extension. Safe-ROS stops at 5 cm;
# at 1 m/s, braking at 1.5 m/s^2, with the 407 ms the reaction is charged
# and a 10 cm margin, the robot needs 0.407 + 0.333 + 0.1 = 0.84 m. The
# field is read from the safety node's own parameter, so the check judges
# the number the node runs: REFUSED.
version: 1
use:
  iso26262: "^1"
  mobile.protective_stop: "^0.1"

hazards:
  collision:
    integrity: ASIL_B
    description: robot drives into an obstacle closer than the stop distance
    monitors: [/too_close]
    on: reported
    when: { field: data, equals: true }
    ftti: 1s
    deadline_by: mobile.protective_stop/stopping_distance
    speed: 1.0 m/s
    decel: 1.5 m/s^2
    margin: 0.1 m
    field: $(param /safety_node stop_distance) m
    reaction: safety.stop

nodes:
  lidar:
    pub:
      scan: {}
    paths:
      sample:
        trigger: { timer: { rate_hz: 10 } }
        output: [scan]
        max_latency: 5ms

  safety_node:
    sub:
      scan: {}
    pub:
      too_close: {}
    paths:
      judge:
        trigger: { input: [scan] }
        output: [too_close]
        max_latency: 5ms

  planner:
    pub:
      cmd_vel_in: {}
    paths:
      plan:
        trigger: { timer: { rate_hz: 10 } }
        output: [cmd_vel_in]
        max_latency: 20ms

  cmd_vel_interceptor:
    sub:
      cmd_vel_in: {}
      too_close:
        on_violation:
          on: [reported]
          reaction: stop
    pub:
      cmd_vel: {}
    paths:
      # The only path: a command in, a command (or a stop) out.
      gate:
        trigger: { input: [cmd_vel_in] }
        output: [cmd_vel]
        max_latency: 2ms
      # The fix: the report itself triggers the stop.
      stop:
        trigger: { input: [too_close] }
        output: [cmd_vel]
        max_latency: 2ms
        safe_state: { emits: cmd_vel, settle: 300ms }

event_chains:
  safety.stop:
    trigger: { input: [/too_close] }
    output: [/cmd_vel]

topics:
  /scan:
    type: std_msgs/msg/String
    pub: [lidar/scan]
    sub: [safety_node/scan]
  /too_close:
    type: std_msgs/msg/Bool
    pub: [safety_node/too_close]
    sub: [cmd_vel_interceptor/too_close]
  /cmd_vel_in:
    type: std_msgs/msg/String
    pub: [planner/cmd_vel_in]
    sub: [cmd_vel_interceptor/cmd_vel_in]
  /cmd_vel:
    type: std_msgs/msg/String
    external: sub
    pub: [cmd_vel_interceptor/cmd_vel]
