# Phase 97 follow-up -- contract_takeover_named_link with budgets on its
# emergency-stop event chain, the safety island's case. `sys.estop` crosses
# the handler's call to the stop operator's `operate` service, which the
# operator latches for its 30 Hz tick: the nominal dataflow graph has no
# route from /availability to /estop_cmd, so before this fixture the only
# estimate was rlm's per-manifest flat sum, every node's largest budget
# plus every subscriber hop of the manifest:
#
#   149 (handler) + 57 (availability) + 143 (control_mode) = 349 > 210
#
# a warning on a chain whose route is the reaction walk the hazard rows
# charge: call_mrm 149 + one tick of the operator's timer 33.33 = 182.33.
# The consumer judges the budget on that route and drops the sum:
#
#   sys.estop        210 ms  fits 182.33, no chain-latency
#   sys.estop_tight  180 ms  chain-latency, naming the reaction route

version: 1
use:
  vehicle.braking: "^1"

integrity_levels: [QM, ASIL_A, ASIL_B, ASIL_C, ASIL_D]

capabilities:
  hpc_alive: [/availability]
  hpc_in_odd:
    of: [/availability]
    when: { field: autonomous, equals: false }
  driver_took_over:
    of: [/control_mode]
    when: { field: mode, not_equals: MANUAL }

hazards:
  hpc_loss:
    integrity: ASIL_D
    monitors: [/availability]
    on: omission
    entry_speed: 8.33 m/s
    ftti: 10s
    leaves: engaged
  odd_exit:
    integrity: ASIL_B
    monitors: [/availability]
    on: reported
    when: { field: autonomous, equals: false }
    entry_speed: 8.33 m/s
    ftti: 30s
    leaves: engaged

modes:
  engaged:
    requires: [hpc_alive, hpc_in_odd]
    fallback: [takeover, comfortable, estop]
  takeover:
    requires: [hpc_alive]
    reaction: sys.tor
    min_dwell: { duration: 10s, param: handler.takeover_timeout }
    exit: { holds: driver_took_over, to: manual }
  comfortable:
    requires: [hpc_alive]
    reaction: sys.comfortable
  estop:
    requires: []
    reaction: sys.estop
  manual:
    requires: []

event_chains:
  sys.tor:
    trigger: { input: [/availability] }
    output: [/tor_state]
  sys.comfortable:
    trigger: { input: [/availability] }
    output: [/velocity_limit]
  sys.estop:
    trigger: { input: [/availability] }
    output: [/estop_cmd]
    max_latency: { duration: 210ms, source: requirement }
  sys.estop_tight:
    trigger: { input: [/availability] }
    output: [/estop_cmd]
    max_latency: { duration: 180ms, source: requirement }

links:
  host_serial:
    max_transport:
      duration: 57ms
      source: { measured: { max: 47.43ms, n: 18, margin: 0.2, run: "fixture" } }
  handler_control_mode: { max_transport: 143ms }

nodes:
  handler:
    params:
      takeover_timeout: { type: double }
    sub:
      availability:
        link: host_serial
        qos: { lease_duration: 500ms }
        on_violation: { on: [omission, reported], reaction: call_mrm }
      control_mode: { link: handler_control_mode }
    pub:
      tor_state: {}
    cli:
      comfort_operate: { timeout: 10ms, on_timeout: { enters: estop } }
      estop_operate: {}
    paths:
      on_timer:
        trigger: { timer: { rate: 10Hz } }
        output: [tor_state]
        max_latency: 100ms
      call_mrm:
        trigger: { input: [availability] }
        output: [tor_state, comfort_operate, estop_operate]
        max_latency: 149ms
      driver_exit:
        trigger: { input: [control_mode] }
        output: [tor_state]
        max_latency: 149ms

  comfort_op:
    params:
      min_acceleration: { type: double }
      min_jerk: { type: double }
    srv:
      operate: {}
    pub:
      velocity_limit: {}
    paths:
      operate:
        trigger: { input: [operate] }
        output: [velocity_limit]
        safe_state:
          emits: velocity_limit
          settle: { decel: min_acceleration, jerk: min_jerk }

  estop_op:
    params:
      target_acceleration: { type: double }
      target_jerk: { type: double }
    srv:
      operate: {}
    pub:
      cmd: {}
    paths:
      on_timer:
        trigger: { timer: { rate: 30Hz } }
        output: [cmd]
        safe_state:
          emits: cmd
          settle: { decel: target_acceleration, jerk: target_jerk }

topics:
  /availability:
    type: demo_msgs/msg/Availability
    external: pub
    pub: [/gate/availability]
    sub: [handler/availability]
    rate: 10Hz
  /control_mode:
    type: demo_msgs/msg/ControlMode
    external: pub
    sub: [handler/control_mode]
  /tor_state:
    type: std_msgs/msg/Bool
    external: sub
    pub: [handler/tor_state]
  /velocity_limit:
    type: std_msgs/msg/Float64
    external: sub
    pub: [comfort_op/velocity_limit]
  /estop_cmd:
    type: std_msgs/msg/Float64
    external: sub
    pub: [estop_op/cmd]

services:
  /comfort/operate:
    type: std_srvs/srv/Trigger
    server: [comfort_op/operate]
    client: [handler/comfort_operate]
  /estop/operate:
    type: std_srvs/srv/Trigger
    server: [estop_op/operate]
    client: [handler/estop_operate]
