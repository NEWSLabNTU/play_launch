# Phase 91 E5: contract_ext_process with a pst.rlx whose ftti carries a
# fractional power (times a factor of 1), which the worst-case prover cannot
# encode: both claims are `worst-case-unknown`, a warning that `check
# --strict` makes an error.
#
# Phase 91 E4: extension-examples.md section 6 on contract_fault's chain.
# process.pst derives the hazard's ftti and the settle: no `ftti` is
# written, and the derived one is the requirement. ftti = (11 bar -
# trip) / 0.5 bar/s; settle = valve_stroke = 2s; the reaction is 100 +
# 7 + 2000 = 2107ms. `trip_setpoint` is `param Pressure unit bar`, the
# lidar_driver's `pt101_trip` (9): ftti (11 - 9) bar / 0.5 bar/s = 4s.
version: 1
use: { process.pst: "^0.1", iso26262: "^1" }

hazards:
  drive_blind:
    severity: ASIL_D
    description: vehicle continues with no obstacle data
    guards: [/safety/scan]
    on: omission
    reaction: safety.stop
    trip_setpoint: pt101_trip
    hazard_pressure: 11 bar
    max_rise_rate: 0.5 bar/s

nodes:
  lidar_driver:
    pub:
      scan: {}
    paths:
      sample:
        trigger: { timer: { rate_hz: 50 } }
        output: [scan]
        max_latency: 2ms

  obstacle_detector:
    sub:
      scan:
        min_rate_hz: 50
        qos: { liveliness: manual_by_topic, lease_duration: 100ms }
        on_violation:
          on: [omission]
          reaction: declare_lost
          within: 10ms
    pub:
      obstacles: {}
    paths:
      detect:
        trigger: { input: [scan] }
        output: [obstacles]
        max_latency: 12ms
      declare_lost:
        trigger: { input: [scan] }
        output: [obstacles]
        max_latency: 2ms

  brake_controller:
    sub:
      obstacles:
        max_age: 60ms
        on_violation:
          on: [late, omission]
          reaction: emergency_stop
          within: 20ms
    pub:
      brake_cmd: {}
    paths:
      brake:
        trigger: { input: [obstacles] }
        output: [brake_cmd]
        max_latency: 8ms
      emergency_stop:
        trigger: { input: [obstacles] }
        output: [brake_cmd]
        max_latency: 5ms
        safe_state:
          emits: brake_cmd
          settle: { valve_stroke: 2s }

paths:
  safety.stop:
    trigger: { input: [/safety/scan] }
    output: [/safety/brake_cmd]
    max_latency: 100ms

topics:
  /safety/scan:
    type: std_msgs/msg/String
    pub: [lidar_driver/scan]
    sub: [obstacle_detector/scan]
  /safety/obstacles:
    type: std_msgs/msg/String
    pub: [obstacle_detector/obstacles]
    sub: [brake_controller/obstacles]
  /safety/brake_cmd:
    type: std_msgs/msg/String
    external: sub
    pub: [brake_controller/brake_cmd]
