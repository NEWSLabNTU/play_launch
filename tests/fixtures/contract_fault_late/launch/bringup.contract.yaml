# DELIBERATELY inconsistent (phase 71). Three faults, each its own rule:
#
#   * the lease is 400ms, so 400 + 7 + 200 = 607ms > ftti 500ms
#                                                     -> fault-reaction-budget
#   * `stale_obstacles` names a reaction that is not a scope path
#                                                     -> reaction-unreachable
#   * `unwatched_brake` guards a topic nobody subscribes to, so nothing
#     detects its loss                                 -> hazard-unguarded
#
version: 1

hazards:
  stale_obstacles:
    guards: [/safety/obstacles]
    on: late
    ftti: 300ms
    reaction: safety.nope
  unwatched_brake:
    guards: [/safety/brake_cmd]
    on: omission
    ftti: 1s
    reaction: safety.stop
  drive_blind:
    severity: ASIL_D
    description: vehicle continues with no obstacle data
    guards: [/safety/scan]
    on: omission
    ftti: 500ms
    reaction: safety.stop

nodes:
  lidar_driver:
    pub:
      scan: {}
    paths:
      sample:
        trigger: { timer: { rate_hz: 50 } }
        output: [scan]
        max_latency: 2ms

  obstacle_detector:
    sub:
      scan:
        min_rate_hz: 50
        qos: { liveliness: manual_by_topic, lease_duration: 400ms }
        on_violation:
          on: [omission]
          reaction: declare_lost
          within: 10ms
    pub:
      obstacles: {}
    paths:
      detect:
        trigger: { input: [scan] }
        output: [obstacles]
        max_latency: 12ms
      declare_lost:
        trigger: { input: [scan] }
        output: [obstacles]
        max_latency: 2ms

  brake_controller:
    sub:
      obstacles:
        max_age: 60ms
        on_violation:
          on: [late, omission]
          reaction: emergency_stop
          within: 20ms
    pub:
      brake_cmd: {}
    paths:
      brake:
        trigger: { input: [obstacles] }
        output: [brake_cmd]
        max_latency: 8ms
      emergency_stop:
        trigger: { input: [obstacles] }
        output: [brake_cmd]
        max_latency: 5ms
        safe_state: { emits: brake_cmd, settle: 200ms }

paths:
  safety.stop:
    trigger: { input: [/safety/scan] }
    output: [/safety/brake_cmd]
    max_latency: 100ms

topics:
  /safety/scan:
    type: std_msgs/msg/String
    pub: [lidar_driver/scan]
    sub: [obstacle_detector/scan]
  /safety/obstacles:
    type: std_msgs/msg/String
    pub: [obstacle_detector/obstacles]
    sub: [brake_controller/obstacles]
  /safety/brake_cmd:
    type: std_msgs/msg/String
    external: sub
    pub: [brake_controller/brake_cmd]
