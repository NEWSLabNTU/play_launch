# Phase 91 E1: derivation records written by hand, as an extension will
# write them. The hazard's `detection` (40ms, derived by sensor.warmup) is
# charged BEFORE the 100ms the detectors take, and the settle's duration
# (200ms, derived by vehicle.braking) is charged as any written settle:
# 40 + 100 + route 7 + settle (200 + 150) = 497ms, inside the 500ms FTTI.
# `--explain` prints `derived by` with each record's inputs and trace, and
# the hazard's reaction_total.
version: 1

hazards:
  drive_blind:
    severity: ASIL_D
    description: vehicle continues with no obstacle data
    guards: [/safety/scan]
    on: omission
    ftti: 500ms
    reaction: safety.stop
    detection:
      duration: 40ms
      source:
        derived:
          by: sensor.warmup
          version: 0.2.0
          inputs: { warmup_frames: 2, frame_period: 20ms }
          trace: ["2 frames * 20 ms = 40 ms"]

nodes:
  lidar_driver:
    pub:
      scan: {}
    paths:
      sample:
        trigger: { timer: { rate_hz: 50 } }
        output: [scan]
        max_latency: 2ms

  obstacle_detector:
    sub:
      scan:
        min_rate_hz: 50
        qos: { liveliness: manual_by_topic, lease_duration: 100ms }
        on_violation:
          on: [omission]
          reaction: declare_lost
          within: 10ms
    pub:
      obstacles: {}
    paths:
      detect:
        trigger: { input: [scan] }
        output: [obstacles]
        max_latency: 12ms
      declare_lost:
        trigger: { input: [scan] }
        output: [obstacles]
        max_latency: 2ms

  brake_controller:
    sub:
      obstacles:
        max_age: 60ms
        on_violation:
          on: [late, omission]
          reaction: emergency_stop
          within: 20ms
    pub:
      brake_cmd: {}
    paths:
      brake:
        trigger: { input: [obstacles] }
        output: [brake_cmd]
        max_latency: 8ms
      emergency_stop:
        trigger: { input: [obstacles] }
        output: [brake_cmd]
        max_latency: 5ms
        safe_state:
          emits: brake_cmd
          settle:
            duration: 200ms
            response: 150ms
            source:
              derived:
                by: vehicle.braking
                version: 1.0.0
                sha256: 4f3c9a1d2e8b7c6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a
                inputs: { entry_speed: 1.5 m/s, decel: 7.5 m/s^2 }
                trace: ["v0 / a = 1.5 / 7.5 = 200 ms"]

paths:
  safety.stop:
    trigger: { input: [/safety/scan] }
    output: [/safety/brake_cmd]
    max_latency: 100ms

topics:
  /safety/scan:
    type: std_msgs/msg/String
    pub: [lidar_driver/scan]
    sub: [obstacle_detector/scan]
  /safety/obstacles:
    type: std_msgs/msg/String
    pub: [obstacle_detector/obstacles]
    sub: [brake_controller/obstacles]
  /safety/brake_cmd:
    type: std_msgs/msg/String
    external: sub
    pub: [brake_controller/brake_cmd]
