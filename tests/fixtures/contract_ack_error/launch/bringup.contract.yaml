# Phase 85 D8 -- an error cannot be acknowledged. The body is contract_error's
# (DELIBERATELY INCONSISTENT: publishers promise 100 Hz on 500 Hz channels, so
# `rate-hierarchy` errs per scope and cross-scope).
#
# - acknowledged[0] names the per-scope rate-hierarchy error on /control/cmd:
#   the error still prints, and the entry is error[ack-error];
# - acknowledged[1] names an INFO (derivable-min-rate), which may be
#   acknowledged: printed as ack[derivable-min-rate].
#
# Keep it wrong: the test pins exit 1 and `--expect rate-hierarchy` failing
# on the unexpected ack-error.
version: 1

acknowledged:
  - rule: rate-hierarchy
    at: topics./control/cmd
    reason: an error dressed as a decision
  - rule: derivable-min-rate
    at: nodes./control/control_node.pub.cmd.min_rate_hz
    reason: the promise is kept written out for the reviewer

nodes:
  sensor_node:
    pub:
      points_raw:
        min_rate_hz: 100
    paths:
      tick:
        trigger: { timer: { rate_hz: 100 } }
        output: [points_raw]

  control_node:
    sub:
      points_raw:
        min_rate_hz: 100
    pub:
      cmd:
        min_rate_hz: 100
    paths:
      control:
        trigger: { input: [points_raw] }
        output: [cmd]
        max_latency: 10ms

topics:
  # absolute — the two nodes sit in different namespaces (/perception, /control)
  /perception/points_raw:
    type: std_msgs/msg/String
    pub: [sensor_node/points_raw]
    sub: [control_node/points_raw]
    rate_hz: 500

  /control/cmd:
    type: std_msgs/msg/String
    pub: [control_node/cmd]
    rate_hz: 500
