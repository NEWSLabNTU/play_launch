# Phase 95, S6: the comfortable operator takes `operate`, starts the stop,
# and its response is lost; the client times out. Here `on_timeout` names
# an UNRELATED scope path (the horn, a different actuator), not a lower
# rung of the ladder, and the server declares no `stale_after:`.
#
# Expected: `warning[call-late-effect]`: two reactions may now act. The
# failure branch, 100 ms + the horn's 10 ms route, is longer than the
# success branch (10 + 10) and governs the rung's route.
version: 1
use:
  iso26262: "^1"

functions:
  hpc_alive: [/availability]

hazards:
  hpc_loss:
    severity: ASIL_B
    description: the planner's availability stops arriving
    guards: [/availability]
    on: omission
    ftti: 5s
    enters: engaged

modes:
  engaged:
    requires: [hpc_alive]
    fallback: [comfortable, emergency_stop]
  comfortable:
    requires: []
    reaction: sys.comfortable
  emergency_stop:
    requires: []
    reaction: sys.emergency_stop

paths:
  sys.comfortable:
    trigger: { input: [/availability] }
    output: [/comfort_cmd]
  sys.emergency_stop:
    trigger: { input: [/availability] }
    output: [/estop_cmd]
  sys.horn:
    trigger: { input: [/availability] }
    output: [/horn_cmd]

nodes:
  gate:
    pub:
      availability: {}
    paths:
      report:
        trigger: { timer: { rate_hz: 10 } }
        output: [availability]
        max_latency: 20ms

  # The floor's own detector: it reaches the emergency stop over a TOPIC, so
  # the floor crosses no call and every verdict below is the comfortable
  # rung's.
  watchdog:
    sub:
      availability:
        qos: { liveliness: manual_by_topic, lease_duration: 500ms }
        on_violation: { on: [omission], reaction: brake }
    pub:
      estop_request: {}
    paths:
      brake:
        trigger: { input: [availability] }
        output: [estop_request]
        max_latency: 5ms

  estop_op:
    sub:
      request: {}
    pub:
      cmd: {}
    paths:
      brake:
        trigger: { input: [request] }
        output: [cmd]
        max_latency: 5ms
        safe_state: { emits: cmd, settle: 500ms }

  handler:
    sub:
      availability:
        qos: { liveliness: manual_by_topic, lease_duration: 500ms }
        on_violation: { on: [omission], reaction: call_mrm }
    cli:
      operate: { call: async, timeout: 100ms, on_timeout: { reaction: sys.horn } }
    paths:
      call_mrm:
        trigger: { input: [availability] }
        output: [operate]
        max_latency: 10ms

  comfort_op:
    srv:
      operate: {}
    pub:
      cmd: {}
    paths:
      operate:
        trigger: { input: [operate] }
        output: [cmd]
        max_latency: 10ms
        safe_state:
          emits: cmd
          settle: 1000ms

  horn_op:
    sub:
      request: {}
    pub:
      cmd: {}
    paths:
      honk:
        trigger: { input: [request] }
        output: [cmd]
        max_latency: 5ms

topics:
  /availability:
    type: std_msgs/msg/Header
    pub: [gate/availability]
    sub: [handler/availability, watchdog/availability]
  /estop_request:
    type: std_msgs/msg/Empty
    pub: [watchdog/estop_request]
    sub: [estop_op/request, horn_op/request]
  /comfort_cmd:
    type: std_msgs/msg/Float64
    external: sub
    pub: [comfort_op/cmd]
  /estop_cmd:
    type: std_msgs/msg/Float64
    external: sub
    pub: [estop_op/cmd]
  /horn_cmd:
    type: std_msgs/msg/Bool
    external: sub
    pub: [horn_op/cmd]

services:
  /comfort/operate:
    type: std_srvs/srv/Trigger
    server: [comfort_op/operate]
    client: [handler/operate]
