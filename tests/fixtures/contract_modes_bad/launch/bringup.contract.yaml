# Phase 71 — fault detection and reaction, fitting its budget.
#
# The one authored number is `ftti`. Detection (FDTI) is derived from the
# guard's detectors: obstacle_detector subscribes to /safety/scan with a
# 100ms liveliness lease and REACTS, so the fault is noticed within 100ms.
# Reaction (FRTI) is the derived route of `safety.stop` (declare_lost 2ms +
# emergency_stop 5ms, no clock boundary crossed) plus the plant's settle
# (200ms). 100 + 7 + 200 = 307ms, inside 500ms.
#
# The reaction's sink (/safety/brake_cmd) is deliberately NOT guarded, so
# `reaction-unguarded` warns: who watches the watcher.
version: 1

# DELIBERATELY inconsistent (phase 75). Three faults, each its own rule:
#   * `stopped` — the last rung — still requires `perception`, which this
#     hazard's own guard removes: there is no floor -> ladder-unterminated
#   * `blind_mode` requires /safety/brake_cmd, whose only subscriber
#     declares no on_violation -> mode-requires-unguarded
#   * an override names a requirement nothing declares
#                                                  -> override-target-missing
#   * `degraded` is a rung whose own ROUTE cannot make the 500ms interval:
#     it ends at /safety/status, reached through a 900ms path, while the
#     floor `stopped` ends at /safety/brake_cmd in 7ms. Two rungs, two
#     routes — which is the only shape where a per-rung check says anything
#     the terminal check does not.                 -> ladder-rung-budget
functions:
  perception: [/safety/scan]

modes:
  driving:
    requires: [perception]
    fallback: [degraded, stopped]
  degraded:
    requires: [perception]
    reaction: safety.slow
  stopped:
    requires: [perception]        # the fault takes this away too
    reaction: safety.stop
    overrides:
      paths:
        safety.stop: { max_jitter: 5ms }   # the path declares no max_jitter
  blind_mode:
    requires: [/safety/brake_cmd]
    reaction: safety.stop

hazards:
  drive_blind:
    severity: ASIL_D
    guards: [perception]
    on: omission
    ftti: 500ms
    reaction: driving

nodes:
  lidar_driver:
    pub:
      scan: {}
    paths:
      sample:
        trigger: { timer: { rate_hz: 50 } }
        output: [scan]
        max_latency: 2ms

  obstacle_detector:
    sub:
      scan:
        min_rate_hz: 50
        qos: { liveliness: manual_by_topic, lease_duration: 100ms }
        on_violation:
          on: [omission]
          reaction: declare_lost
          within: 10ms
    pub:
      obstacles: {}
    paths:
      detect:
        trigger: { input: [scan] }
        output: [obstacles]
        max_latency: 12ms
      declare_lost:
        trigger: { input: [scan] }
        output: [obstacles]
        max_latency: 2ms

  brake_controller:
    criticality: high          # what ASIL_D on drive_blind already derives -> derivable-criticality
    sub:
      obstacles:
        max_age: 60ms
        on_violation:
          on: [late, omission]
          reaction: emergency_stop
          within: 20ms
    pub:
      brake_cmd: {}
      status: {}
    paths:
      brake:
        trigger: { input: [obstacles] }
        output: [brake_cmd]
        max_latency: 8ms
      emergency_stop:
        trigger: { input: [obstacles] }
        output: [brake_cmd]
        max_latency: 5ms
        safe_state: { emits: brake_cmd, settle: 200ms }
      # The degraded rung's own hop: same trigger, far slower, different sink.
      slow_stop:
        trigger: { input: [obstacles] }
        output: [status]
        max_latency: 900ms
        safe_state: { emits: status, settle: 0ms }

paths:
  # A rung whose route is far too slow for the hazard's 500ms.
  safety.slow:
    trigger: { input: [/safety/scan] }
    output: [/safety/status]
    max_latency: 950ms
  safety.stop:
    trigger: { input: [/safety/scan] }
    output: [/safety/brake_cmd]
    max_latency: 100ms

topics:
  /safety/scan:
    type: std_msgs/msg/String
    pub: [lidar_driver/scan]
    sub: [obstacle_detector/scan]
  /safety/obstacles:
    type: std_msgs/msg/String
    pub: [obstacle_detector/obstacles]
    sub: [brake_controller/obstacles]
  /safety/brake_cmd:
    type: std_msgs/msg/String
    external: sub
    pub: [brake_controller/brake_cmd]
  /safety/status:
    type: std_msgs/msg/String
    external: sub
    pub: [brake_controller/status]
