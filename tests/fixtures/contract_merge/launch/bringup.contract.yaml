# Root-scope contract for the contract_merge fixture (SystemModel merge
# + full-dump test). Consumer side of /perception/objects lives HERE;
# the producer side lives in perception.contract.yaml — the resolver
# must merge both into one topic entry.
version: 1

nodes:
  planner:
    criticality: high
    sub:
      objects:
        min_rate_hz: 5
        max_age: 200ms
        required: true
        # The hop's 5ms, stated where it is paid (phase 90 G3: it was the
        # topic-level default in perception.contract.yaml, which this
        # subscriber inherited across the include).
        max_transport: 5ms
      map:
        state: true
    srv:
      compute:
        max_response: 100ms

topics:
  /perception/objects:
    type: std_msgs/msg/String
    sub: [planner/objects]
    qos:
      reliability: reliable
      depth: 5
  /sensing/points:
    external: pub
    type: std_msgs/msg/String

services:
  /planning/compute:
    type: std_srvs/srv/Trigger
    server: [planner/compute]

paths:
  e2e:
    trigger: { input: [/sensing/points] }
    output: [/perception/objects]
    max_latency: 80ms
    tolerance: 10ms
    drop:
      max_count: 2 / 25
      max_consecutive: 5
