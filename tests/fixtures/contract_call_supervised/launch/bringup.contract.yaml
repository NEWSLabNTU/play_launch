# Phase 95, S1: the safety island's comfortable stop. The handler fires
# `operate` on its reaction and drains the reply later (`call: async`); the
# comfortable rung is supervised to standstill (`supervise: { enters:
# emergency_stop, mechanism: timer }` on the operator's settle).
#
# Expected: no `call-*` finding. The walk crosses the call, finds the
# rung's effect supervised and takes no failure branch there; the success
# route grows by the request leg alone, 10 + 1.5 + 10 = 21.5 ms.
version: 1
use:
  iso26262: "^1"
supervision: { tick: 1ms, switch: 1ms }

functions:
  hpc_alive: [/availability]

hazards:
  hpc_loss:
    severity: ASIL_B
    description: the planner's availability stops arriving
    guards: [/availability]
    on: omission
    ftti: 5s
    enters: engaged

modes:
  engaged:
    requires: [hpc_alive]
    fallback: [comfortable, emergency_stop]
  comfortable:
    requires: []
    reaction: sys.comfortable
  emergency_stop:
    requires: []
    reaction: sys.emergency_stop

paths:
  sys.comfortable:
    trigger: { input: [/availability] }
    output: [/comfort_cmd]
  sys.emergency_stop:
    trigger: { input: [/availability] }
    output: [/estop_cmd]

nodes:
  gate:
    pub:
      availability: {}
    paths:
      report:
        trigger: { timer: { rate_hz: 10 } }
        output: [availability]
        max_latency: 20ms

  # The floor's own detector: it reaches the emergency stop over a TOPIC, so
  # the floor crosses no call and every verdict below is the comfortable
  # rung's.
  watchdog:
    sub:
      availability:
        qos: { liveliness: manual_by_topic, lease_duration: 500ms }
        on_violation: { on: [omission], reaction: brake }
    pub:
      estop_request: {}
    paths:
      brake:
        trigger: { input: [availability] }
        output: [estop_request]
        max_latency: 5ms

  estop_op:
    sub:
      request: {}
    pub:
      cmd: {}
    paths:
      brake:
        trigger: { input: [request] }
        output: [cmd]
        max_latency: 5ms
        safe_state: { emits: cmd, settle: 500ms }

  handler:
    sub:
      availability:
        qos: { liveliness: manual_by_topic, lease_duration: 500ms }
        on_violation: { on: [omission], reaction: call_mrm }
      odom: { min_rate_hz: 10, state: true, max_transport: 5ms }
    cli:
      operate: { call: async, max_transport: 1.5ms }
    paths:
      call_mrm:
        trigger: { input: [availability] }
        output: [operate]
        max_latency: 10ms

  comfort_op:
    srv:
      operate: {}
    pub:
      cmd: {}
    paths:
      operate:
        trigger: { input: [operate] }
        output: [cmd]
        max_latency: 10ms
        safe_state:
          emits: cmd
          settle: 
            duration: 1000ms
            supervise:
              enters: emergency_stop
              mechanism: timer
              observes: handler/odom

topics:
  /availability:
    type: std_msgs/msg/Header
    pub: [gate/availability]
    sub: [handler/availability, watchdog/availability]
  /estop_request:
    type: std_msgs/msg/Empty
    pub: [watchdog/estop_request]
    sub: [estop_op/request]
  /comfort_cmd:
    type: std_msgs/msg/Float64
    external: sub
    pub: [comfort_op/cmd]
  /estop_cmd:
    type: std_msgs/msg/Float64
    external: sub
    pub: [estop_op/cmd]
  /odom:
    type: nav_msgs/msg/Odometry
    external: pub
    rate_hz: 10
    sub: [handler/odom]

services:
  /comfort/operate:
    type: std_srvs/srv/Trigger
    server: [comfort_op/operate]
    client: [handler/operate]
