# Phase 98: the integrity level under its pre-0.3.3 keys `severity:` and
# `severity_levels:`. Read with a warning in rlm v0.3.3-v0.3.5, refused
# since v0.3.6 naming `integrity:`/`integrity_levels:`; `migrate --write`
# rewrites both. Otherwise contract_profile_sil on ISO 26262's scale:
# ASIL_B derives `medium`.
version: 1
severity_levels: [QM, ASIL_A, ASIL_B, ASIL_C, ASIL_D]

hazards:
  drive_blind:
    severity: ASIL_B
    description: vehicle continues with no obstacle data
    monitors: [/safety/scan]
    on: omission
    ftti: 500ms
    reaction: safety.stop

nodes:
  lidar_driver:
    pub:
      scan: {}
    paths:
      sample:
        trigger: { timer: { rate_hz: 50 } }
        output: [scan]
        max_latency: 2ms

  obstacle_detector:
    sub:
      scan:
        min_rate_hz: 50
        qos: { liveliness: manual_by_topic, lease_duration: 100ms }
        on_violation:
          on: [omission]
          reaction: declare_lost
          within: 10ms
    pub:
      obstacles: {}
    paths:
      detect:
        trigger: { input: [scan] }
        output: [obstacles]
        max_latency: 12ms
      declare_lost:
        trigger: { input: [scan] }
        output: [obstacles]
        max_latency: 2ms

  brake_controller:
    sub:
      obstacles:
        max_age: 60ms
        on_violation:
          on: [late, omission]
          reaction: emergency_stop
          within: 20ms
    pub:
      brake_cmd: {}
    paths:
      brake:
        trigger: { input: [obstacles] }
        output: [brake_cmd]
        max_latency: 8ms
      emergency_stop:
        trigger: { input: [obstacles] }
        output: [brake_cmd]
        max_latency: 5ms
        safe_state: { emits: brake_cmd, settle: 200ms }

event_chains:
  safety.stop:
    trigger: { input: [/safety/scan] }
    output: [/safety/brake_cmd]
    max_latency: 100ms

topics:
  /safety/scan:
    type: std_msgs/msg/String
    pub: [lidar_driver/scan]
    sub: [obstacle_detector/scan]
  /safety/obstacles:
    type: std_msgs/msg/String
    pub: [obstacle_detector/obstacles]
    sub: [brake_controller/obstacles]
  /safety/brake_cmd:
    type: std_msgs/msg/String
    external: sub
    pub: [brake_controller/brake_cmd]
