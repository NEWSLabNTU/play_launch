# Phase 99 (rlm v0.3.10 renamed, v0.3.11 refuses): a system.toml in the
# pre-rename spelling, `[tiers.*]` and `group_tiers`. `resolve --system`
# refuses it, naming the new keys and `migrate`; `play_launch migrate`
# rewrites it to `[tasks.*]` and `group_tasks`, and the result resolves to
# the same execution layer as its twin `twin.system.toml`, written in the new
# spelling.
# Used by tests/tests/system_tasks_deprecated.rs with
# tests/fixtures/multihost/launch/multihost.launch.xml host:=all.

[[component]]
name = "hub"
group_tiers = { main = "ctrl" }   # the hub's one group

[[component]]
name = "talker1"
group_tiers = { main = "telem" }

[tiers.ctrl]
spin_period = "10ms"
[tiers.ctrl.posix]
priority = 40
sched_class = "SCHED_FIFO"

[tiers.telem]
spin_period = "100ms"
[tiers.telem.posix]
priority = 10
