# Phase 71 W4 — Autoware's minimum-risk-manoeuvre chain as a contract.
#
# Every number is Autoware 1.5.0's own, read from its parameter files:
#   mrm_handler.param.yaml            timeout_operation_mode_availability: 0.5
#                                     update_rate: 10, timeout_call_mrm_behavior: 0.01
#   mrm_emergency_stop_operator       update_rate: 30, target_acceleration: -2.5
#   vehicle_cmd_gate.param.yaml       update_rate: 10, system_emergency_heartbeat_timeout: 0.5
# The settle (1.2 s) is what -2.5 m/s² takes from 3 m/s; illustrative.
#
# Two hazards, deliberately one on each side of the line: with 2 s to react
# the chain fits with 56 ms of slack; with 1.5 s it does not, and the
# diagnostic names the 500 ms availability timeout as the term to tighten.
# That arithmetic is implied by Autoware's parameter files and performed by
# nothing until now.
version: 1
use:
  iso26262: "^1"

# Phase 75 — Autoware's diagnostic graph, as functions and modes. Its three
# layers ARE this shape: diag units are topics, `and`/`or` function units are
# guard groups, and the `/autoware/modes/*` units are modes over them.
# `mrm_handler` walks a fixed ladder at runtime; here the ladder is declared,
# and every rung is checked in its own right.
functions:
  operation_mode_availability: [/system/operation_mode/availability]

modes:
  autonomous:
    description: full autonomy
    requires: [operation_mode_availability]
    fallback: [comfortable_stop, emergency_stop]
  comfortable_stop:
    # A graded reaction: slower, and checked against the same interval as
    # the floor — which is the whole point of `degradation-level-time`. Not for
    # the two hazards below, though: they are the loss of the very function
    # this rung requires, so since phase 83 (#0057) they skip it.
    requires: [operation_mode_availability]
    reaction: system.comfortable_stop
    # Phase 100 F1: what the level commands while it lasts. Comfortable stop
    # caps the planner's velocity at zero. Not on `max_velocity_candidates`:
    # several planners propose limits there and the external velocity limit
    # selector takes the least, so the selector's output is the final
    # element (phase 102 E3 found the first draft's `arbiter-bypass`).
    commands:
      /planning/scenario_planning/max_velocity:
        - { field: max_velocity, equals: 0 }
  emergency_stop:
    requires: []
    reaction: system.emergency_stop
    # The minimal risk condition, at the gate's output: a zero velocity
    # command and no positive acceleration (the deceleration ramps at a
    # jerk, so its final value is not in the first message).
    commands:
      /control/command/control_cmd:
        - { field: longitudinal.velocity, equals: 0 }
        - { field: longitudinal.acceleration, le: 0 }

hazards:
  mode_unavailable:
    integrity: ASIL_D
    description: the operation-mode availability stream stops; the vehicle must reach a stop
    # Illustrative, as the integrity is: the HARA owns the id (phase 100 F3).
    requirement: { id: SG-AW-1, source: "Autoware HARA (illustrative)" }
    monitors: [/system/operation_mode/availability]
    on: omission
    ftti: 2s
    enters: autonomous          # a MODE: the ladder is the reaction
  mode_unavailable_tight:
    description: the same chain against a 1.5 s interval, which it cannot meet
    monitors: [/system/operation_mode/availability]
    on: omission
    ftti: 1500ms
    reaction: system.emergency_stop

paths:
  # The comfortable-stop route: the MRM operator's slower behaviour, through
  # the same handler and gate. 110 (handler) + 34 (operator) + 100 (gate) is
  # the emergency route; comfortable stop decelerates over ~4 s, so its own
  # settle dominates and the rung cannot make a 2 s interval.
  system.comfortable_stop:
    trigger: { input: [/system/operation_mode/availability] }
    output: [/planning/scenario_planning/max_velocity_candidates]
    max_latency: 4s
  system.emergency_stop:
    trigger: { input: [/system/operation_mode/availability] }
    output: [/control/command/control_cmd]
    max_latency: 300ms

topics:
  # The selector's output, named by the endpoints the launch file's remaps
  # give it. Both ends are written only because rlm v0.3.13 drops a topic
  # declared with a type alone (fixed in rlm after v0.3.13, phase 102 E3);
  # with the fix the `type:` line is all this entry needs.
  /planning/scenario_planning/max_velocity:
    type: autoware_internal_planning_msgs/msg/VelocityLimit
    pub: [/planning/scenario_planning/external_velocity_limit_selector/output_external_velocity_limit]
    sub: [/planning/scenario_planning/velocity_smoother/input_external_velocity_limit_mps]
  /system/operation_mode/availability:
    type: tier4_system_msgs/msg/OperationModeAvailability
    external: pub
    sub: [/system/mrm_handler/operation_mode_availability]
