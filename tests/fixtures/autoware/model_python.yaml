    /planning/planning_evaluator:
      scope: autoware_planning_evaluator/planning_evaluator.launch.xml
      pkg: autoware_planning_evaluator
      exec: planning_evaluator
      params:
        front_overhang: 1.0
        left_overhang: 0.128
        max_steer_angle: 0.7
        output_metrics: 'False'
        rear_overhang: 1.1
        right_overhang: 0.128
        use_sim_time: 'False'
        vehicle_height: 2.5
        wheel_base: 2.79
        wheel_radius: 0.383
        wheel_tread: 1.64
        wheel_width: 0.235
      remaps:
      - from: ~/input/odometry
        to: /localization/kinematic_state
      - from: ~/input/acceleration
        to: /localization/acceleration
      - from: ~/input/trajectory
        to: /planning/trajectory
      - from: ~/input/reference_trajectory
        to: /planning/scenario_planning/lane_driving/motion_planning/path_optimizer/trajectory
      - from: ~/input/objects
        to: /perception/object_recognition/objects
      - from: ~/input/modified_goal
        to: /planning/scenario_planning/modified_goal
      - from: ~/input/route
        to: /planning/mission_planning/route
      - from: ~/input/vector_map
        to: /map/vector_map
      - from: ~/input/turn_indicators_status
        to: /vehicle/status/turn_indicators_status
      - from: ~/input/steering_status
        to: /vehicle/status/steering_status
      params_files:
      - |
        /**:
          ros__parameters:
            max_vel: 4.17           # max velocity limit [m/s]

            # constraints param for normal driving
            normal:
              min_acc: -1.0         # min deceleration [m/ss]
              max_acc: 1.0          # max acceleration [m/ss]
              min_jerk: -1.0        # min jerk [m/sss]
              max_jerk: 1.0         # max jerk [m/sss]

            # constraints to be observed
            limit:
              min_acc: -2.5         # min deceleration limit [m/ss]
              max_acc: 1.0          # max acceleration limit [m/ss]
              min_jerk: -1.5        # min jerk limit [m/sss]
              max_jerk: 1.5         # max jerk limit [m/sss]
      - |
        /**:
          ros__parameters:
            ego_frame: base_link # reference frame of ego

            metrics_for_publish:
              - curvature
              - point_interval
              - relative_angle
              - resampled_relative_angle
              - length
              - duration
              - velocity
              - acceleration
              - jerk
              - lateral_deviation
              - yaw_deviation
              - velocity_deviation
              - lateral_trajectory_displacement_local
              - lateral_trajectory_displacement_lookahead
              - stability
              - stability_frechet
              - obstacle_distance
              - obstacle_ttc
              - modified_goal_longitudinal_deviation
              - modified_goal_lateral_deviation
              - modified_goal_yaw_deviation
              - stop_decision
              - abnormal_stop_decision
              - blinker_change_count
              - steer_change_count

            metrics_for_output:
              - curvature
              - point_interval
              - relative_angle
              - resampled_relative_angle
              - length
              - duration
              - velocity
              - acceleration
              - jerk
              - lateral_deviation
              - yaw_deviation
              - velocity_deviation
              - lateral_trajectory_displacement_local
              - lateral_trajectory_displacement_lookahead
              - stability
              - stability_frechet
              - obstacle_distance
              - obstacle_ttc
              - modified_goal_longitudinal_deviation
              - modified_goal_lateral_deviation
              - modified_goal_yaw_deviation
              - stop_decision
              - abnormal_stop_decision
              - blinker_change_count
              - steer_change_count

            trajectory:
              min_point_dist_m: 0.1 # [m] minimum distance between two successive points to use for angle calculation
              evaluation_time_s: 5.0 # [s] time duration for trajectory evaluation in seconds
              lookahead:
                max_dist_m: 5.0 # [m] maximum distance from ego along the trajectory to use for calculation
                max_time_s: 3.0 # [s] maximum time ahead of ego along the trajectory to use for calculation

            obstacle:
              dist_thr_m: 0.0 # [m] distance between ego and the obstacle below which a collision is considered

            stop_decision:
              topic_prefix: /planning/planning_factors/ # topic prefix for planning factors
              time_count_threshold_s: 60.0 # [s] time threshold to count a stop as a new one
              dist_count_threshold_m: 5.0 # [m] distance threshold to count a stop as a new one
              abnormal_deceleration_threshold_mps2: 2.0 # [m/s^2] abnormal deceleration threshold for a stop to be considered as abnormal
              module_list:  # list of modules to be checked for stop decision.
                - avoidance_by_lane_change
                - behavior_path_planner
                - blind_spot
                - crosswalk
                - detection_area
                - dynamic_obstacle_avoidance
                - dynamic_obstacle_stop
                - goal_planner
                - intersection
                - lane_change_left
                - lane_change_right
                - motion_velocity_planner
                - merge_from_private
                - no_drivable_lane
                - no_stopping_area
                - obstacle_cruise
                - obstacle_slow_down
                - obstacle_stop
                - occlusion_spot
                - out_of_lane
                - run_out
                - side_shift
                - start_planner
                - static_obstacle_avoidance
                - stop_line
                - surround_obstacle_checker
                - traffic_light
                - virtual_traffic_light
                - walkway

            blinker_change_count:
              window_duration_s: 5.0 # [s] window duration of counting blinker change for publishing

            steer_change_count:
              window_duration_s: 5.0 # [s] window duration of counting steer change for publishing
              steer_rate_margin: 0.2 # [rad/s] margin of steer_rate around 0 to count as steer change
      node_name: planning_evaluator
    /planning/planning_validator:
      scope: autoware_planning_validator/planning_validator.launch.xml
      pkg: autoware_planning_validator
