    /rviz2:
      scope: autoware_launch/autoware.launch.xml
      pkg: rviz2
      exec: rviz2
      params:
        front_overhang: 1.0
        left_overhang: 0.128
        max_steer_angle: 0.7
        rear_overhang: 1.1
        right_overhang: 0.128
        use_sim_time: 'False'
        vehicle_height: 2.5
        wheel_base: 2.79
        wheel_radius: 0.383
        wheel_tread: 1.64
        wheel_width: 0.235
      respawn: true
      env:
      - name: QT_QPA_PLATFORMTHEME
        value: qt5ct
      args:
      - -d
      - /opt/autoware/1.5.0/share/autoware_launch/rviz/autoware.rviz
      - -s
      - /opt/autoware/1.5.0/share/autoware_launch/rviz/image/autoware.png
      node_name: rviz2
    /simulation/autoware_simple_planning_simulator_node:
      scope: autoware_simple_planning_simulator/simple_planning_simulator.launch.py
      pkg: autoware_simple_planning_simulator
      exec: autoware_simple_planning_simulator_node
      params:
        acc_time_constant: 0.1
        acc_time_delay: 0.1
        add_measurement_noise: 'False'
        cg_to_front_m: 1.228
        cg_to_rear_m: 1.5618
        enable_road_slope_simulation: 'True'
        front_corner_stiffness: 17000.0
        front_overhang: 1.0
        front_overhang_m: 0.5
        initial_engage_state: 'True'
        initialize_source: INITIAL_POSE_TOPIC
        left_overhang: 0.128
        mass_kg: 1460.0
        max_steer_angle: 0.7
        origin_frame_id: map
        rear_corner_stiffness: 20000.0
        rear_overhang: 1.1
        rear_overhang_m: 0.5
        right_overhang: 0.128
        simulated_frame_id: base_link
        steer_dead_band: 0.0
        steer_lim: 1.0
        steer_rate_lim: 5.0
        steer_time_constant: 0.27
        steer_time_delay: 0.24
        timer_sampling_time_ms: 25
        use_sim_time: 'False'
        vehicle_height: 2.5
        vehicle_model_type: DELAY_STEER_ACC_GEARED
        vel_lim: 50.0
        vel_rate_lim: 7.0
        wheel_base: 2.79
        wheel_radius: 0.383
        wheel_tread: 1.64
        wheel_width: 0.235
        width_m: 2.0
        x_stddev: 0.0001
        y_stddev: 0.0001
        yaw_inertia_kgm2: 2170.0
      remaps:
      - from: input/vector_map
        to: /map/vector_map
      - from: input/initialpose
        to: /initialpose3d
      - from: input/ackermann_control_command
        to: /control/command/control_cmd
      - from: input/actuation_command
        to: /control/command/actuation_cmd
      - from: input/manual_ackermann_control_command
        to: /vehicle/command/manual_control_cmd
      - from: input/gear_command
        to: /control/command/gear_cmd
      - from: input/manual_gear_command
        to: /vehicle/command/manual_gear_command
      - from: input/turn_indicators_command
        to: /control/command/turn_indicators_cmd
      - from: input/hazard_lights_command
        to: /control/command/hazard_lights_cmd
      - from: input/trajectory
        to: /planning/trajectory
      - from: input/engage
        to: /vehicle/engage
      - from: input/control_mode_request
        to: /control/control_mode_request
      - from: output/twist
        to: /vehicle/status/velocity_status
      - from: output/imu
        to: /sensing/imu/imu_data
      - from: output/steering
        to: /vehicle/status/steering_status
      - from: output/gear_report
        to: /vehicle/status/gear_status
      - from: output/turn_indicators_report
        to: /vehicle/status/turn_indicators_status
      - from: output/hazard_lights_report
        to: /vehicle/status/hazard_lights_status
      - from: output/control_mode_report
        to: /vehicle/status/control_mode
      - from: output/actuation_status
        to: /vehicle/status/actuation_status
      - from: output/odometry
        to: /localization/kinematic_state
      - from: output/acceleration
        to: /localization/acceleration
      - from: output/pose
        to: /simulation/debug/localization/pose_estimator/pose_with_covariance
    /simulation/detected_object_feature_remover:
      scope: autoware_detected_object_feature_remover/detected_object_feature_remover.launch.xml
      pkg: autoware_detected_object_feature_remover
      exec: detected_object_feature_remover_node
      params:
        front_overhang: 1.0
        left_overhang: 0.128
        max_steer_angle: 0.7
        rear_overhang: 1.1
        right_overhang: 0.128
        use_sim_time: 'False'
        vehicle_height: 2.5
        wheel_base: 2.79
        wheel_radius: 0.383
        wheel_tread: 1.64
        wheel_width: 0.235
      remaps:
      - from: ~/input
        to: /perception/object_recognition/detection/objects_with_feature
      - from: ~/output
        to: /perception/object_recognition/detection/objects
      node_name: detected_object_feature_remover
    /simulation/dummy_perception_publisher:
      scope: autoware_dummy_perception_publisher/dummy_perception_publisher.launch.xml
      pkg: autoware_dummy_perception_publisher
      exec: autoware_dummy_perception_publisher_node
      params:
        detection_successful_rate: 0.999
        enable_ray_tracing: 'False'
        front_overhang: 1.0
        left_overhang: 0.128
        max_steer_angle: 0.7
        object_centric_pointcloud: 'False'
        publish_ground_truth: 'True'
        rear_overhang: 1.1
        right_overhang: 0.128
        use_base_link_z: 'True'
        use_object_recognition: 'True'
        use_sim_time: 'False'
        vehicle_height: 2.5
        visible_range: 300.0
        wheel_base: 2.79
        wheel_radius: 0.383
        wheel_tread: 1.64
        wheel_width: 0.235
      remaps:
      - from: output/dynamic_object
        to: /perception/object_recognition/detection/labeled_clusters
      - from: output/objects_pose
        to: debug/object_pose
      - from: output/points_raw
        to: /perception/obstacle_segmentation/pointcloud
      - from: input/object
        to: dummy_perception_publisher/object_info
      - from: input/reset
        to: input/reset
      - from: input/predicted_objects
        to: /perception/object_recognition/objects
      - from: output/debug/ground_truth_objects
        to: debug/ground_truth_objects
      params_files:
      - |
        /**:
          ros__parameters:
            # Existing parameters
            visible_range: 100.0
            detection_successful_rate: 0.8
            enable_ray_tracing: true
            use_object_recognition: true
            use_base_link_z: true
            publish_ground_truth: false
            random_seed: 0
            use_fixed_random_seed: false
            object_centric_pointcloud: false
            angle_increment: 0.004363323  # 0.25 * PI / 180.0


            # Prediction parameters
            min_predicted_path_keep_duration: 3.0     # seconds - minimum time to keep using same prediction
            switch_time_threshold: 2.0  # seconds - time threshold to switch from straight-line to predicted path

            # Remapping validation parameters - Vehicle
            vehicle:
              max_remapping_distance: 2.0      # meters
