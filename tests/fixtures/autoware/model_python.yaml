        icc_parameters.pointcloud.height_buffer: 0.5
        icc_parameters.pointcloud.latency: 0.3
        icc_parameters.pointcloud.min_height: 0.5
        icc_parameters.pointcloud.velocity_estimation.buffer_size: 10
        icc_parameters.pointcloud.velocity_estimation.max_acceleration: 20.0
        icc_parameters.pointcloud.velocity_estimation.max_history_time: 0.5
        icc_parameters.pointcloud.velocity_estimation.max_velocity: 25.0
        icc_parameters.pointcloud.velocity_estimation.observation_time: 0.3
        icc_parameters.pointcloud.voxel_grid_filter.min_size: 3
        icc_parameters.pointcloud.voxel_grid_filter.x: 0.2
        icc_parameters.pointcloud.voxel_grid_filter.y: 0.2
        icc_parameters.pointcloud.voxel_grid_filter.z: 0.2
        icc_parameters.right_turn.check_crossing_lanes: false
