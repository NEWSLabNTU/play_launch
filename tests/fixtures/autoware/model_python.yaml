        wheel_radius: 0.383
        wheel_tread: 1.64
        wheel_width: 0.235
      remaps:
      - from: ~/input/odometry
        to: /localization/kinematic_state
      - from: ~/input/acceleration
        to: /localization/acceleration
      - from: ~/input/trajectory
        to: /planning/trajectory
      - from: ~/input/vector_map
        to: /map/vector_map
      - from: ~/input/route
        to: /planning/mission_planning/route
      - from: ~/input/behavior_path
        to: /planning/scenario_planning/lane_driving/behavior_planning/path_with_lane_id
      - from: ~/input/steering_status
        to: /vehicle/status/steering_status
      - from: ~/input/objects
        to: /perception/object_recognition/objects
      params_files:
      - |
        /**:
          ros__parameters:
            output_metrics_only_moving:
              enabled: true # if true, aggregate metrics for output_metrics statistics only when the ego is moving
              metric_list:
                - closest_object_distance
            planning_factor_metrics:
              topic_prefix: /planning/planning_factors/
              stop_deviation:
                module_list: # list of modules to be checked for stop deviation. Here we assume that the `module` inside the planning_factors should be the same as the topic name.
                  - blind_spot
                  - crosswalk
                  - detection_area
                  - intersection
                  - merge_from_private
                  - no_drivable_lane
                  - no_stopping_area
                  - stop_line
                  - traffic_light
                  - virtual_traffic_light
                  - walkway
            object_metrics:
              distance_filter_thr_m: 30.0 # [m] distance filter threshold for predicted objects
      node_name: control_evaluator
