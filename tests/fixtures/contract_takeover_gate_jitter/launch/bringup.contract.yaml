# contract_takeover_jitter with the availability publisher in the tree:
# `gate` republishes the verdict on a 10 Hz timer released up to 6 ms late
# (`trigger: { timer: { rate_hz: 10, jitter: 6ms } }`, 20 ms of work), as
# the island's demo gate does. Its release jitter is a wait on its clock,
# so it is charged wherever its period is:
#
#   odd_exit detection     the gate reports every 100 + 6 jitter + 20 = 126
#   sys.notice             /odd -> gate (100 + 6 + 20) -> link 57 ->
#                          call_mrm 149 = 332 > 330: scope-budget, with
#                          106.00ms of it sampling cost
#
# Without the jitter the two read 120 and 326 (no warning).
version: 1
rlm: v0.1.49
use:
  vehicle.braking: "^1"

severity_levels: [QM, ASIL_A, ASIL_B, ASIL_C, ASIL_D]

functions:
  hpc_alive: [/availability]
  hpc_in_odd:
    of: [/availability]
    when: { field: autonomous, equals: false }
  driver_took_over:
    of: [/control_mode]
    when: { field: mode, not_equals: MANUAL }

hazards:
  hpc_loss:
    severity: ASIL_D
    guards: [/availability]
    on: omission
    entry_speed: 8.33 m/s
    ftti: 10s
    enters: engaged
  odd_exit:
    severity: ASIL_B
    guards: [/availability]
    on: reported
    when: { field: autonomous, equals: false }
    entry_speed: 8.33 m/s
    ftti: 30s
    enters: engaged

modes:
  engaged:
    requires: [hpc_alive, hpc_in_odd]
    fallback: [takeover, comfortable, estop]
  takeover:
    requires: [hpc_alive]
    reaction: sys.tor
    window: { duration: 10s, param: handler.takeover_timeout }
    exit: { holds: driver_took_over, to: manual }
  comfortable:
    requires: [hpc_alive]
    reaction: sys.comfortable
  estop:
    requires: []
    reaction: sys.estop
  manual:
    requires: []

paths:
  sys.notice:
    trigger: { input: [/odd] }
    output: [/tor_state]
    max_latency: 330ms
  sys.tor:
    trigger: { input: [/availability] }
    output: [/tor_state]
  sys.comfortable:
    trigger: { input: [/availability] }
    output: [/velocity_limit]
  sys.estop:
    trigger: { input: [/availability] }
    output: [/estop_cmd]

nodes:
  gate:
    sub:
      odd: { state: true }
    pub:
      availability: {}
    paths:
      on_timer:
        trigger: { timer: { rate_hz: 10, jitter: 6ms } }
        output: [availability]
        max_latency: 20ms

  handler:
    params:
      takeover_timeout: { type: double }
    sub:
      availability:
        max_transport: 57ms
        qos: { lease_duration: 500ms }
        on_violation: { on: [omission, reported], reaction: call_mrm }
      control_mode: { max_transport: 143ms }
    pub:
      tor_state: {}
    cli:
      comfort_operate: { timeout: 10ms, on_timeout: { reaction: estop } }
      estop_operate: {}
    paths:
      on_timer:
        trigger: { timer: { rate_hz: 10, jitter: 18ms } }
        output: [tor_state]
        max_latency: 100ms
      call_mrm:
        trigger: { input: [availability] }
        output: [tor_state, comfort_operate, estop_operate]
        max_latency: 149ms
      driver_exit:
        trigger: { input: [control_mode] }
        output: [tor_state]
        max_latency: 149ms

  comfort_op:
    params:
      min_acceleration: { type: double }
      min_jerk: { type: double }
    srv:
      operate: {}
    pub:
      velocity_limit: {}
    paths:
      operate:
        trigger: { input: [operate] }
        output: [velocity_limit]
        safe_state:
          emits: velocity_limit
          settle: { decel: min_acceleration, jerk: min_jerk }

  estop_op:
    params:
      target_acceleration: { type: double }
      target_jerk: { type: double }
    srv:
      operate: {}
    pub:
      cmd: {}
    paths:
      on_timer:
        trigger: { timer: { rate_hz: 30, jitter: 5ms } }
        output: [cmd]
        safe_state:
          emits: cmd
          settle: { decel: target_acceleration, jerk: target_jerk }

topics:
  /availability:
    type: demo_msgs/msg/Availability
    pub: [gate/availability]
    sub: [handler/availability]
  /odd:
    type: std_msgs/msg/Bool
    external: pub
    sub: [gate/odd]
  /control_mode:
    type: demo_msgs/msg/ControlMode
    external: pub
    sub: [handler/control_mode]
  /tor_state:
    type: std_msgs/msg/Bool
    external: sub
    pub: [handler/tor_state]
  /velocity_limit:
    type: std_msgs/msg/Float64
    external: sub
    pub: [comfort_op/velocity_limit]
  /estop_cmd:
    type: std_msgs/msg/Float64
    external: sub
    pub: [estop_op/cmd]

services:
  /comfort/operate:
    type: std_srvs/srv/Trigger
    server: [comfort_op/operate]
    client: [handler/comfort_operate]
  /estop/operate:
    type: std_srvs/srv/Trigger
    server: [estop_op/operate]
    client: [handler/estop_operate]
