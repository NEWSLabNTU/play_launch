# Phase 85 T7 (I7) -- clean, with a transport bound the fault-reaction
# arithmetic does not read: the subscriber-level one on control_node/scan
# (the island's shape, a 57 ms link on the handler's input). It
# must produce one info[declared-not-charged] until phase 85 I1 charges the
# key; then T1 takes over. (The topic-level default this fixture also
# carried was removed in rlm v0.3.15.)
version: 1

nodes:
  sensor_node:
    pub:
      scan: {}
    paths:
      tick:
        trigger: { timer: { rate: 10Hz } }
        output: [scan]
        max_latency: 5ms

  control_node:
    sub:
      scan:
        link: control_node_scan
    pub:
      cmd: {}
    paths:
      control:
        trigger: { input: [scan] }
        output: [cmd]
        max_latency: 10ms

topics:
  /dx/scan:
    type: std_msgs/msg/String
    pub: [sensor_node/scan]
    sub: [control_node/scan]
  /dx/cmd:
    type: std_msgs/msg/String
    pub: [control_node/cmd]

links:
  control_node_scan: { max_transport: 57ms }
