# Phase 93 -- a supervised budget no runtime monitor reads. The gate's
# report is a timer path: the route monitor stamps the take of a path's
# first input, so nothing arms a deadline for it, and `supervised-unlowered`
# refuses the claim that its miss is caught.
version: 1
use:
  vehicle.braking: "^1"

supervision: { tick: 1ms, switch: 0.05ms }

severity_levels: [QM, ASIL_A, ASIL_B, ASIL_C, ASIL_D]

functions:
  hpc_alive: [/availability]
  hpc_in_odd:
    of: [/availability]
    when: { field: autonomous, equals: false }
  driver_took_over:
    of: [/control_mode]
    when: { field: mode, not_equals: MANUAL }

hazards:
  odd_exit:
    severity: ASIL_B
    guards: [/availability]
    on: reported
    when: { field: autonomous, equals: false }
    entry_speed: 8.33 m/s
    ftti: { duration: 30s, source: requirement }
    enters: engaged
  hpc_loss:
    severity: ASIL_D
    guards: [/availability]
    on: omission
    entry_speed: 3.0 m/s
    ftti: { duration: 3s, source: requirement }
    enters: engaged

modes:
  engaged:
    requires: [hpc_alive, hpc_in_odd]
    fallback: [takeover, comfortable, estop]
  takeover:
    requires: [hpc_alive]
    reaction: sys.tor
    window: { duration: 10s, param: handler.takeover_timeout, source: requirement }
    exit: { holds: driver_took_over, to: manual }
  comfortable:
    requires: [hpc_alive]
    reaction: sys.comfortable
  estop:
    requires: []
    reaction: sys.estop
  manual:
    requires: []

paths:
  sys.tor:
    trigger: { input: [/availability] }
    output: [/tor_state]
  sys.comfortable:
    trigger: { input: [/availability] }
    output: [/planner_cmd]
  sys.estop:
    trigger: { input: [/availability] }
    output: [/estop_cmd]

nodes:
  gate:
    pub:
      availability: {}
    paths:
      report:
        trigger: { timer: { rate_hz: 10 } }
        output: [availability]
        max_latency: { duration: 20ms, source: analysed, supervise: { enters: estop, mechanism: timer } }

  handler:
    params:
      takeover_timeout: { type: double }
    sub:
      availability:
        qos: { lease_duration: 500ms }
        on_violation: { on: [omission, reported], reaction: call_mrm }
      control_mode: {}
    pub:
      tor_state: {}
    cli:
      comfort_operate: {}
      estop_operate: {}
    paths:
      # Phase 84: the handler holds the request on its tick and reads the
      # deadline there, so the rung below's first hop (call_mrm, 110 ms =
      # the 100 ms tick + a 10 ms call) is where the late notice is charged
      # (`window-expiry`).
      on_timer:
        trigger: { timer: { rate_hz: 10 } }
        output: [tor_state]
        max_latency: 100ms
      call_mrm:
        trigger: { input: [availability] }
        output: [tor_state, comfort_operate, estop_operate]
        max_latency: { duration: 110ms, source: { measured: { margin: 0.2, terms: { tick: { period: 100ms, max: 5ms, n: 600 }, work: { max: 3.2ms, n: 12 } } } } }
      driver_exit:
        trigger: { input: [control_mode] }
        output: [tor_state]
        max_latency: 100ms

  comfort_op:
    params:
      min_acceleration: { type: double }
      min_jerk: { type: double }
    srv:
      operate: {}
    pub:
      velocity_limit: {}
    paths:
      # A service callback that publishes (brief D F3): the walk continues
      # through it, and its safe state is carried to the planner's command.
      operate:
        trigger: { input: [operate] }
        output: [velocity_limit]
        safe_state:
          emits: velocity_limit
          settle: { decel: min_acceleration, jerk: min_jerk }

  planner:
    sub:
      velocity_limit: {}
    pub:
      cmd: {}
    paths:
      follow:
        trigger: { input: [velocity_limit] }
        output: [cmd]
        max_latency: { duration: 300ms, source: { measured: { max: 250ms, n: 5, margin: 0.2 } } }

  estop_op:
    params:
      target_acceleration: { type: double }
      target_jerk: { type: double }
    srv:
      operate: {}
    pub:
      cmd: {}
    paths:
      on_timer:
        trigger: { timer: { rate_hz: 30 } }
        output: [cmd]
        safe_state:
          emits: cmd
          settle: { decel: target_acceleration, jerk: target_jerk }

topics:
  /availability:
    type: demo_msgs/msg/Availability
    pub: [gate/availability]
    sub: [handler/availability]
  /control_mode:
    type: demo_msgs/msg/ControlMode
    external: pub
    sub: [handler/control_mode]
  /tor_state:
    type: std_msgs/msg/Bool
    external: sub
    pub: [handler/tor_state]
  /velocity_limit:
    type: std_msgs/msg/Float64
    pub: [comfort_op/velocity_limit]
    sub: [planner/velocity_limit]
  /planner_cmd:
    type: std_msgs/msg/Float64
    external: sub
    pub: [planner/cmd]
  /estop_cmd:
    type: std_msgs/msg/Float64
    external: sub
    pub: [estop_op/cmd]

services:
  /comfort/operate:
    type: std_srvs/srv/Trigger
    server: [comfort_op/operate]
    client: [handler/comfort_operate]
  /estop/operate:
    type: std_srvs/srv/Trigger
    server: [estop_op/operate]
    client: [handler/estop_operate]
