# The same fault reaction as `contract_fault`, handed over a SERVICE.
#
# `contract_fault`'s detector publishes /safety/obstacles and the brake
# controller subscribes to it. Here the detector CALLS /safety/stop instead,
# which is the shape every MRM chain has: the node that NOTICES the fault asks
# the node that ACTS to act. Autoware's is `mrm_handler` calling
# `/system/mrm/emergency_stop/operate` on `mrm_emergency_stop_operator`.
#
# Every number is `contract_fault`'s, so the derived verdict must be too:
# detection 100ms (the lease) + route 7ms (2ms declare_lost + 5ms
# emergency_stop) + settle 200ms = 307ms inside a 500ms ftti. A reaction route
# that stops at the service boundary gets neither the 7ms nor the settle, and
# the ASIL_D never reaches brake_controller -- which is backwards, because
# brake_controller is the node that stops the vehicle.
#
# One diagnostic here is not the fixture's fault: the checker's `wiring` rule
# (upstream, ros-launch-manifest) looks for a path's `output:` endpoint in a
# topic's `pub:` list only, so `stop_request` -- a `cli:` endpoint, wired by
# `services:` -- is reported as unwired. The reaction route is derived
# regardless; the rule is the next thing to teach about services.
version: 1

hazards:
  drive_blind:
    severity: ASIL_D
    description: vehicle continues with no obstacle data
    guards: [/safety/scan]
    on: omission
    ftti: 500ms
    reaction: safety.stop

nodes:
  lidar_driver:
    pub:
      scan: {}
    paths:
      sample:
        trigger: { timer: { rate_hz: 50 } }
        output: [scan]
        max_latency: 2ms

  obstacle_detector:
    sub:
      scan:
        min_rate_hz: 50
        qos: { liveliness: manual_by_topic, lease_duration: 100ms }
        on_violation:
          on: [omission]
          reaction: declare_lost
          within: 10ms
    cli:
      stop_request: {}
    paths:
      # The reaction: the lease expires and the detector asks for the stop.
      # Its output is the CLIENT endpoint, which is what makes the request an
      # edge of the graph rather than a fact about the node.
      declare_lost:
        trigger: { input: [scan] }
        output: [stop_request]
        max_latency: 2ms

  brake_controller:
    criticality: high          # what ASIL_D on drive_blind already derives -> derivable-criticality
    srv:
      stop: {}
    pub:
      brake_cmd: {}
    paths:
      emergency_stop:
        trigger: { input: [stop] }
        output: [brake_cmd]
        max_latency: 5ms
        safe_state: { emits: brake_cmd, settle: 200ms }

paths:
  safety.stop:
    trigger: { input: [/safety/scan] }
    output: [/safety/brake_cmd]
    max_latency: 100ms

topics:
  /safety/scan:
    type: std_msgs/msg/String
    pub: [lidar_driver/scan]
    sub: [obstacle_detector/scan]
  /safety/brake_cmd:
    type: std_msgs/msg/String
    external: sub
    pub: [brake_controller/brake_cmd]

services:
  /safety/stop:
    type: std_srvs/srv/Trigger
    server: [brake_controller/stop]
    client: [obstacle_detector/stop_request]
