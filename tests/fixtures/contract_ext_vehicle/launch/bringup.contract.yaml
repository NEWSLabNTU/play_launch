# Phase 91 E9/E10: extension-examples.md section 1 on contract_fault's
# chain. The bundled vehicle.braking derives the settle from the brake
# controller's own parameters and the hazard's entry speed: v0 = 30 km/h =
# 8.3333 m/s, a = |-2.5| m/s^2, j = |-1.5| m/s^3, v_r = a^2/(2j) = 2.0833
# m/s < v0, so 256 ms + a/j 1666.67 ms + (v0 - v_r)/a 2500 ms = 4422.67 ms,
# the example's number. The reaction is 100 + 7 + 4422.67 = 4529.67 ms
# against a 10 s interval. The model carries 4422.67 ms on the safe state,
# with vehicle.braking as its source (E10).
version: 1
use: { vehicle.braking: "^1", iso26262: "^1" }

hazards:
  drive_blind:
    severity: ASIL_D
    description: vehicle continues with no obstacle data
    guards: [/safety/scan]
    on: omission
    ftti: 10s
    reaction: safety.stop
    entry_speed: 30 km/h

nodes:
  lidar_driver:
    pub:
      scan: {}
    paths:
      sample:
        trigger: { timer: { rate_hz: 50 } }
        output: [scan]
        max_latency: 2ms

  obstacle_detector:
    sub:
      scan:
        min_rate_hz: 50
        qos: { liveliness: manual_by_topic, lease_duration: 100ms }
        on_violation:
          on: [omission]
          reaction: declare_lost
          within: 10ms
    pub:
      obstacles: {}
    paths:
      detect:
        trigger: { input: [scan] }
        output: [obstacles]
        max_latency: 12ms
      declare_lost:
        trigger: { input: [scan] }
        output: [obstacles]
        max_latency: 2ms

  brake_controller:
    params:
      target_acceleration: { type: double }
      target_jerk: { type: double }
    sub:
      obstacles:
        max_age: 60ms
        on_violation:
          on: [late, omission]
          reaction: emergency_stop
          within: 20ms
    pub:
      brake_cmd: {}
    paths:
      brake:
        trigger: { input: [obstacles] }
        output: [brake_cmd]
        max_latency: 8ms
      emergency_stop:
        trigger: { input: [obstacles] }
        output: [brake_cmd]
        max_latency: 5ms
        safe_state:
          emits: brake_cmd
          settle:
            decel: target_acceleration
            jerk: target_jerk
            response: 256ms

paths:
  safety.stop:
    trigger: { input: [/safety/scan] }
    output: [/safety/brake_cmd]
    max_latency: 100ms

topics:
  /safety/scan:
    type: std_msgs/msg/String
    pub: [lidar_driver/scan]
    sub: [obstacle_detector/scan]
  /safety/obstacles:
    type: std_msgs/msg/String
    pub: [obstacle_detector/obstacles]
    sub: [brake_controller/obstacles]
  /safety/brake_cmd:
    type: std_msgs/msg/String
    external: sub
    pub: [brake_controller/brake_cmd]
