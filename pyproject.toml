[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "play_launch"
version = "0.18.2"
description = "ROS 2 launch inspection tool - resolve, run, and analyze launch executions with resource monitoring"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
    {name = "Lin, Hsiang-Jui", email = "jerry73204@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]
keywords = ["ros2", "launch", "profiling", "monitoring", "robotics"]

# Floors at the versions Ubuntu's apt ships (22.04 for Humble, 24.04 for
# Jazzy): pip must not try to replace a Debian-installed package, which it
# cannot uninstall ("RECORD file not found"). lark>=1.2 broke
# `pip install play_launch` on Jazzy, whose python3-lark is 1.1.9.
dependencies = [
    "pyyaml>=5.4.1",
    "lark>=1.1.1",
    "packaging>=21.3",
    # Version matches Ubuntu 22.04 APT package (python3-plotly)
    "plotly>=5.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.8.0",
    "build",
]
# No-ops, kept for one release so `pip install "play_launch[jazzy]"` lines
# written for 0.17.0's per-distribution packages still work. The wheel now
# carries every distribution its Python serves and picks one at run time
# (phase 92); remove these at 0.20.
humble = []
jazzy = []
kilted = []
lyrical = []
rolling = []

[project.scripts]
play_launch = "play_launch.cli:main"
play_launch_io_helper = "play_launch.io_helper_cli:main"
# `play_launch` is the whole product: it carries every verb a user needs,
# `resolve`/`dump`/`check`/`plot`/`contract` included. The layer-2
# `ros-launch-resolve` binary is developer/integration surface and is
# deliberately NOT a console script here.

[project.urls]
Repository = "https://github.com/NEWSLabNTU/play_launch"
Documentation = "https://github.com/NEWSLabNTU/play_launch#readme"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
# One payload per ROS distribution the wheel serves (phase 92, payload.py).
"play_launch" = [
    "dist/*/bin/*",
    "dist/*/lib/*",
    "dist/*/lib/play_launch_container/*",
    "dist/*/share/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # Line too long - plotly hovertemplates are inherently long
]

[tool.ruff.lint.per-file-ignores]
# Re-exports and compatibility imports
"python/play_launch/dump/__init__.py" = ["F401", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests", "python/play_launch"]
python_files = ["test_*.py"]
