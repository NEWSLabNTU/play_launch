# Provider sidecar for bringup.launch.xml — ships in rt_av_demo's installed
# share dir, discovered automatically by `play_launch check/resolve`.
#
# The numbers here are the workload's declared intent. They must stay
# consistent with the launch file's burn parameters, because the chain budget
# is checked against the DECLARED costs, not the measured ones: a contract
# claiming 8 ms for a node that burns 40 would pass the checker and miss every
# deadline at runtime.
version: 1

# Phase 71: the hazard the chain exists to prevent, and the one number that
# turns the rate requirements below into a safety requirement. Detection is
# the lease on obstacle_detector's subscription; reaction is `safety.stop`'s
# route plus the brake's settle. `just fault` kills the lidar mid-run and
# compares the observed fault-to-brake time to what `check` derives.
hazards:
  drive_blind:
    severity: ASIL_D
    description: vehicle continues with no obstacle data
    guards: [/safety/scan]
    on: omission
    ftti: 500ms
    reaction: safety.stop

nodes:
  lidar_driver:
    criticality: high
    pub:
      scan:
        min_rate_hz: 50
        # Phase 74: applied to the node as qos_overrides parameters. With
        # `manual_by_topic` liveliness every publish asserts the writer is
        # alive, so a publisher that stops lapses at the lease and the
        # SUBSCRIBER's DDS reports it — no watchdog code needed to detect.
        # (`automatic` would NOT do this: it is asserted by the participant,
        # so a node that stops publishing but stays up never lapses.)
        qos: { liveliness: manual_by_topic, lease_duration: 100ms }
    paths:
      sample:
        trigger: { timer: { rate_hz: 50 } }
        output: [scan]
        # The boundary's own execution cost. Without it the feasibility check
        # counts this hop as ZERO and says so ("feasible ON INCOMPLETE
        # EVIDENCE") — the verdict would be optimistic by an unknown amount.
        # 2 ms matches the node's burn_ms in bringup.launch.xml.
        max_latency: 2ms

  obstacle_detector:
    criticality: high
    sub:
      scan:
        min_rate_hz: 50
        # The detector: 100ms without a scan is a lost lidar. `watchdog_ms`
        # in bringup.launch.xml is this number, applied by the node itself.
        qos: { liveliness: manual_by_topic, lease_duration: 100ms }
        on_violation:
          on: [omission]
          reaction: declare_lost
          within: 10ms
          mechanism: qos      # DDS detects (the lease); the watchdog only reacts
    pub:
      obstacles:
        min_rate_hz: 50
    paths:
      detect:
        trigger: { input: [scan] }
        output: [obstacles]
        max_latency: 12ms
      # Publishes an "obstacles unknown" message so the brake reacts.
      declare_lost:
        trigger: { input: [scan] }
        output: [obstacles]
        max_latency: 2ms

  brake_controller:
    criticality: high
    sub:
      obstacles:
        min_rate_hz: 50
        max_age: 60ms
        on_violation:
          on: [late, omission]
          reaction: emergency_stop
          within: 20ms
          mechanism: application
    pub:
      brake_cmd:
        min_rate_hz: 50
    paths:
      brake:
        trigger: { input: [obstacles] }
        output: [brake_cmd]
        max_latency: 8ms
      emergency_stop:
        trigger: { input: [obstacles] }
        output: [brake_cmd]
        max_latency: 5ms
        # `settle_ms` in bringup.launch.xml: the plant's time to reach the
        # safe state once commanded. A parameter here so the oracle is exact.
        safe_state: { emits: brake_cmd, settle: 200ms }

# The safety chain, and the claim under test — stated as a scope path, which
# names the two ENDS of the requirement and lets the route be derived from the
# `trigger`/`output` facts the three nodes above already declare (phase 68 W4).
#
# sampling_cost = the 50 Hz boundary's period = 20 ms.
# event segment  = detect 12 ms + brake 8 ms = 20 ms.
# total          = 40 ms, inside the 60 ms budget with 20 ms of honest slack.
#
# That slack is where scheduling lives. With RT applied the chain should land
# well under 60 ms; without it, the mission and best-effort load eats the slack
# and the deadline is missed. The budget is deliberately not tight — a chain
# that only just fits would miss for arithmetic reasons rather than scheduling
# ones, and would prove nothing.
paths:
  lidar_to_brake:
    trigger: { input: [/safety/scan] }
    output: [/safety/brake_cmd]
    max_latency: 60ms
  # The reaction route, from the guarded topic to the safe-state command.
  safety.stop:
    trigger: { input: [/safety/scan] }
    output: [/safety/brake_cmd]
    max_latency: 100ms

topics:
  /safety/scan:
    type: rt_av_demo/msg/Stamped
    pub: [lidar_driver/scan]
    sub: [obstacle_detector/scan]
  /safety/obstacles:
    type: rt_av_demo/msg/Stamped
    pub: [obstacle_detector/obstacles]
    sub: [brake_controller/obstacles]
  /safety/brake_cmd:
    type: rt_av_demo/msg/Stamped
    pub: [brake_controller/brake_cmd]
    sub: []
