<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>play_launch - Web UI</title>
    <script>
        // The theme before first paint: app.js applies it again, but only
        // after the module graph loads, which showed a flash of the other
        // theme on every load.
        try {
            var t = localStorage.getItem('theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* storage blocked: light, the :root default */ }
    </script>
    <!-- CSS Modules -->
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/navigation.css">
    <link rel="stylesheet" href="/assets/css/diagnostics.css">
    <link rel="stylesheet" href="/assets/css/panels.css">
    <link rel="stylesheet" href="/assets/css/nodes.css">
    <link rel="stylesheet" href="/assets/css/logs.css">
    <link rel="stylesheet" href="/assets/css/graph.css">
    <link rel="stylesheet" href="/assets/css/metrics.css">
    <link rel="stylesheet" href="/assets/css/launch-tree.css">
    <link rel="stylesheet" href="/assets/css/entities.css">
    <link rel="stylesheet" href="/assets/css/health.css">
    <link rel="stylesheet" href="/assets/css/chains.css">
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
