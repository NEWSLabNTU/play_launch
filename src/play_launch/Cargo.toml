[package]
name = "play_launch"
version = "0.8.2"
edition = "2024"
authors = ["Lin, Hsiang-Jui <jerry73204@gmail.com>"]
description = "ROS launch record player"
homepage = "https://github.com/NEWSLabNTU/play_launch"
repository = "https://github.com/NEWSLabNTU/play_launch.git"
readme = "../../README.md"
license = "BSD-3-Clause"

# Main binary
[[bin]]
name = "play_launch"
path = "src/main.rs"

# Helper daemon binary (requires CAP_SYS_PTRACE capability)
[[bin]]
name = "play_launch_io_helper"
path = "src/bin/play_launch_io_helper/main.rs"

# RT scheduling helper daemon (requires CAP_SYS_NICE capability)
[[bin]]
name = "play_launch_rt_helper"
path = "src/bin/play_launch_rt_helper/main.rs"

[features]
# nano-ros #285 / RFC-0059 — `runtime` carries everything that talks to a live
# ROS graph: rclrs + the colcon-generated `play_launch_msgs`. Those are not
# ordinary registry deps; `colcon-cargo-ros2` generates them from the ament
# environment and patches them in, which is why they are pinned `"*"`. Anything
# that links them therefore needs play_launch's full colcon setup to build.
#
# The `resolve` pipeline (launch_dump -> manifest_loader -> model_builder ->
# sched_loader) touches none of it, so `--no-default-features` yields a
# library that builds under plain cargo with no ROS, no ament and no colcon.
# That is what lets nano-ros link the resolver into its own small helper.
default = ["runtime"]
runtime = [
    "dep:rclrs",
    "dep:play_launch_msgs",
    "dep:composition_interfaces",
    "dep:diagnostic_msgs",
    "dep:lifecycle_msgs",
    "dep:rcl_interfaces",
]

[dependencies]
chrono = "0.4"
clap = { version = "4.5.16", features = ["derive"] }
composition_interfaces = { version = "*", optional = true }
csv = "1.3"
dashmap = "6.1"
diagnostic_msgs = { version = "*", optional = true }
lifecycle_msgs = { version = "*", optional = true }
eyre = "0.6.12"
play_launch_msgs = { version = "*", optional = true }
play_launch_parser = { path = "../play_launch_parser/crates/play_launch_parser" }
ros-launch-manifest-types = { path = "../ros-launch-manifest/types" }
ros-launch-manifest-check = { path = "../ros-launch-manifest/check" }
ros-launch-manifest-sched = { path = "../ros-launch-manifest/sched" }
ros-launch-manifest-model = { path = "../ros-launch-manifest/model" }
spsc_shm = { path = "../spsc_shm" }
futures = "0.3.30"
glob = "0.3"
humantime-serde = "1.1"
itertools = "0.13.0"
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process"] }
num_cpus = "1.16"
nvml-wrapper = "0.11"
rcl_interfaces = { version = "*", optional = true }
thiserror = "1.0"
rclrs = { version = "0.7", optional = true }
rayon = "1.10.0"
serde = { version = "1.0.209", features = ["derive"] }
sha2 = "0.10"
bincode = "1.3"
serde_json = "1.0.127"
serde_yaml_ng = "0.10"
shell-quote = "0.7.1"
sysinfo = { version = "0.32", default-features = false, features = ["system", "network"] }
tokio = { version = "1.40.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1.40"

# Web UI dependencies
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }
rust-embed = "8"
mime_guess = "2"
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }
async-stream = "0.3"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
which = "6.0"
pyo3 = { version = "0.24", features = ["auto-initialize", "py-clone"] }
yaml-rust2 = "0.11.0"

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3.8"
ts-rs = "12"

# Release profile optimization for smaller binary size
[profile.release]
strip = true        # Strip debug symbols (reduces binary size by ~50-60%)
lto = "thin"        # Thin link-time optimization (balance between speed and size)
