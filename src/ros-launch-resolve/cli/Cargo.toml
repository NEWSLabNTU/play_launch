# The `ros-launch-resolve` binary — the verbs that operate on a launch tree
# without needing a ROS graph: resolve, dump, contract, plot.
[package]
name = "ros-launch-resolve-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for ros-launch-resolve"

[[bin]]
name = "ros-launch-resolve"
path = "src/main.rs"

# Four dependencies, and that is the point: the verb bodies live in
# `ros_launch_resolve::verbs`, so this crate parses argv, maps `*Args` to
# `*Inputs`, and prints nothing itself. The manifest crates, the parser,
# serde, tokio and num_cpus all left with the handlers they belonged to; a
# new entry here should make you ask whether the logic wanting it belongs in
# the library instead, where `play_launch` can reach it too.
[dependencies]
ros-launch-resolve = { path = "../resolve" }
clap = { version = "4", features = ["derive"] }
eyre = { workspace = true }
# `env-filter` is NOT a default feature. Without it `RUST_LOG` is silently
# ignored, which is what shipped in 0.9.0's first cut: the init read the
# variable, branched on it, and then built two identical subscribers.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
