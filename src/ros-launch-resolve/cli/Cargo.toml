# The `ros-launch-resolve` binary — the verbs that operate on a launch tree
# without needing a ROS graph: resolve, dump, contract, plot.
[package]
name = "ros-launch-resolve-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for ros-launch-resolve"

[[bin]]
name = "ros-launch-resolve"
path = "src/main.rs"

[dependencies]
ros-launch-resolve = { path = "../resolve" }
ros-launch-manifest-model = { workspace = true }
ros-launch-manifest-check = { workspace = true }
ros-launch-manifest-types = { workspace = true }
clap = { version = "4", features = ["derive"] }
eyre = { workspace = true }
ros-launch-manifest-sched = { workspace = true }
play_launch_parser = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
# `env-filter` is NOT a default feature. Without it `RUST_LOG` is silently
# ignored, which is what shipped in 0.9.0's first cut: the init read the
# variable, branched on it, and then built two identical subscribers.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
num_cpus = "1"
sha2 = { workspace = true }
glob = "0.3"
