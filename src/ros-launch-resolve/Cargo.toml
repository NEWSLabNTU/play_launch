# ros-launch-resolve — the resolver layer (RFC-0060 layer 2).
#
# A ROS launch tree in, a checked `SystemModel` out. Sits between
# `ros-launch-manifest` (the spec, theory and algorithms — no ROS, no Python)
# and `play_launch` (the Linux runtime).
#
# THE INVARIANT: this workspace must resolve and build under PLAIN CARGO, with
# no ROS install, no ament environment and no colcon. CPython is the one
# external requirement, and only because `.launch.py` must be executed against
# the user's interpreter. If a dependency ever needs colcon-generated crates,
# it belongs in play_launch, not here — that coupling is exactly what this
# layer exists to remove for downstream consumers (nano-ros issue 0285).
[workspace]
resolver = "2"
members = ["resolve", "cli"]

[workspace.package]
# Tracks play_launch's release version. These crates lived in their own
# repository until phase-55 W1 folded them in, and the two now build, ship and
# release together — an independent 0.1.0 only meant `ros-launch-resolve
# --version` disagreed with the wheel that carries it, and stamped 0.1.0 into
# every SystemModel. `ros-launch-manifest` is the genuinely independent
# dependency and keeps its own line (pinned by tag).
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NEWSLabNTU/ros-launch-resolve"

[workspace.dependencies]
ros-launch-manifest-types = { git = "https://github.com/NEWSLabNTU/ros-launch-manifest.git", tag = "v0.1.8" }
ros-launch-manifest-model = { git = "https://github.com/NEWSLabNTU/ros-launch-manifest.git", tag = "v0.1.8" }
ros-launch-manifest-sched = { git = "https://github.com/NEWSLabNTU/ros-launch-manifest.git", tag = "v0.1.8" }
# default-features off so the LEAF decides `smt` (rlm v0.1.8): the checker's
# z3-backed satisfiability rule is default-on upstream, and forwarding the
# choice is what lets a distribution build (nano-ros's `nros-launch-resolve`)
# drop the z3 -> bindgen chain and its host prereqs (libclang, libz3-dev)
# without a fork. A no-smt checker says so itself: it registers a stub rule
# that emits one Info diagnostic instead of silently checking less.
ros-launch-manifest-check = { git = "https://github.com/NEWSLabNTU/ros-launch-manifest.git", tag = "v0.1.8", default-features = false }
play_launch_parser = { path = "parser/crates/play_launch_parser" }
eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "0.8"
tracing = "0.1"
sha2 = "0.10"

