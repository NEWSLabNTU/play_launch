# The shape of Nav2's nav2_params.yaml: section keys without a leading
# slash, and a costmap's section nested under the costmap's namespace.
amcl:
  ros__parameters:
    alpha1: 0.2
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: map.yaml
local_costmap:
  local_costmap:
    ros__parameters:
      resolution: 0.05
