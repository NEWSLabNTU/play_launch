[package]
name = "play_launch_parser"
version = "0.1.0"
edition = "2024"
authors = ["play_launch_parser contributors"]
description = "High-performance ROS 2 launch file parser in Rust"
license = "Apache-2.0"
repository = "https://github.com/tier4/play_launch_parser"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
roxmltree = "0.19"
thiserror = "1.0"
log = "0.4"
rand = "0.8"

# Used ONLY by `src/main.rs`, so they are gated behind the default `cli`
# feature. Cargo resolves dependencies per PACKAGE, not per target, so
# without the gate every library consumer also builds `env_logger` and
# its `env_filter`/`regex`/`jiff` tree for a binary it never runs.
# `default = ["cli"]` keeps `cargo build` producing the binary as before;
# library consumers opt out with `default-features = false`.
clap = { version = "4.0", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }

# `once_cell` stays: `file_cache` and `substitution/types` use it.
# pyo3 left with 0897 W2b — the Python half is its own crate now.
once_cell = "1.19"

# Performance optimizations (Phase 7.1)
dashmap = "5.5"           # Concurrent HashMap for caching

# Performance optimizations (Phase 7.4)
lru = "0.16.3"            # LRU cache for substitution parsing

# Parser parity fixes
indexmap = "2.0"          # Preserves insertion order for configurations
shlex = "1.3.0"

[features]
default = ["cli"]
# The command-line binary and nothing else.
cli = ["dep:clap", "dep:env_logger"]
ir = []

[dev-dependencies]
# The Python half, for TESTS only (nano-ros issue 0897 W2b/W3).
#
# A dev-dependency cycle is allowed by cargo and is the right shape
# here: `pyexec` depends on this crate normally, and this crate
# depends on it only to TEST the paths that need an interpreter.
# The shipped rlib still links no libpython — that is the whole
# point — and `tests/python_tests.rs` registers the backend in the
# guard every Python test already takes.
play_launch_parser_pyexec = { path = "../pyexec" }
tempfile = "3.8"

[[bin]]
name = "play_launch_parser"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "play_launch_parser"
path = "src/lib.rs"
