version: 1
nodes:
  consumer:
    sub:
      in: {}
      in2: {}
    paths:
      consume:
        trigger: { input: [in] }
        output: []
        max_latency_ms: 40
      consume2:
        trigger: { input: [in2] }
        output: []
        max_latency_ms: 10
topics:
  /link/out:
    type: t
    sub: [consumer/in]
  /link/out2:
    type: t
    sub: [consumer/in2]
