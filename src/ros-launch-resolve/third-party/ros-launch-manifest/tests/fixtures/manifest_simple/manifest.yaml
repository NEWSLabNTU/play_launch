# Simple talker/listener — clean manifest, no violations expected.
version: 1

nodes:
  talker:
    pub:
      chatter:
        min_rate_hz: 1
  listener:
    sub:
      chatter:
        min_rate_hz: 1

topics:
  chatter:
    type: std_msgs/msg/String
    pub: [talker/chatter]
    sub: [listener/chatter]
    rate_hz: 1
    qos:
      reliability: reliable
      durability: volatile
