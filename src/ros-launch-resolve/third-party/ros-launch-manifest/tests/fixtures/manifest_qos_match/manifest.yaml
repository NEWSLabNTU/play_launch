# QoS match rule end-to-end fixture.
#
# This fixture exercises the qos-match rule (Phase 34.7) which catches
# structural issues with single QoS profiles:
# - depth: 0 with keep_last → error
# - keep_all with depth set → warning (depth ignored)
# - best_effort + transient_local → warning (late joiners won't get data)
#
# It also includes one clean topic with the canonical "deliver to late
# joiners" pattern (reliable + transient_local + keep_last + depth: 1)
# to verify that legitimate combinations don't trigger warnings.
version: 1

nodes:
  publisher_ok:
    pub:
      map: { min_rate_hz: 1 }
      telemetry: { min_rate_hz: 10 }
      data: { min_rate_hz: 10 }
      history_test: { min_rate_hz: 10 }

topics:
  # Canonical "deliver to late joiners" — should produce NO diagnostics.
  /map/vector_map:
    type: autoware_map_msgs/msg/LaneletMapBin
    pub: [publisher_ok/map]
    qos:
      reliability: reliable
      durability: transient_local
      history: keep_last
      depth: 1

  # depth: 0 with keep_last — error (cannot buffer any messages).
  /telemetry/depth_zero:
    type: std_msgs/msg/String
    pub: [publisher_ok/telemetry]
    qos:
      reliability: reliable
      history: keep_last
      depth: 0

  # best_effort + transient_local — warning (late joiners won't get data).
  /sensor/best_effort_transient:
    type: std_msgs/msg/String
    pub: [publisher_ok/data]
    qos:
      reliability: best_effort
      durability: transient_local

  # keep_all with depth set — warning (depth ignored when keep_all).
  /debug/keep_all_with_depth:
    type: std_msgs/msg/String
    pub: [publisher_ok/history_test]
    qos:
      reliability: reliable
      history: keep_all
      depth: 10
