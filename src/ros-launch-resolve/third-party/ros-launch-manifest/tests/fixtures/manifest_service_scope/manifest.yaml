# Intra-scope service wiring with scope interface.
# Modeled after autoware_mission_planner_universe/mission_planner.yaml.
#
# Pattern: mission_planner (server) + route_selector (client) in same scope.
# Topics for intra-container communication. Service clients proxy through
# route_selector. Full scope interface with pub/sub/srv/cli.
version: 1

nodes:
  mission_planner:
    sub:
      vector_map:
        state: true
        required: true
      odometry:
        state: true
      modified_goal:
        state: true
    pub:
      route: {}
      state: {}
    srv:
      clear_route: {}
      set_lanelet_route: {}
      set_waypoint_route: {}

  route_selector:
    sub:
      planner_route:
        state: true
      planner_state:
        state: true
    pub:
      main_route: {}
      main_state: {}
    cli:
      clear_route: {}
      set_lanelet_route: {}
      set_waypoint_route: {}

topics:
  planner_route:
    type: autoware_planning_msgs/msg/LaneletRoute
    pub: [mission_planner/route]
    sub: [route_selector/planner_route]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  planner_state:
    type: autoware_planning_msgs/msg/RouteState
    pub: [mission_planner/state]
    sub: [route_selector/planner_state]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

services:
  clear_route:
    type: autoware_planning_msgs/srv/ClearRoute
    server: [mission_planner/clear_route]
    client: [route_selector/clear_route]
  set_lanelet_route:
    type: autoware_planning_msgs/srv/SetLaneletRoute
    server: [mission_planner/set_lanelet_route]
    client: [route_selector/set_lanelet_route]
  set_waypoint_route:
    type: autoware_planning_msgs/srv/SetWaypointRoute
    server: [mission_planner/set_waypoint_route]
    client: [route_selector/set_waypoint_route]

