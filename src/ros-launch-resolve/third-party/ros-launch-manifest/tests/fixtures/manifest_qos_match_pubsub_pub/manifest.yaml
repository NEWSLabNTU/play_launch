# Cross-scope QoS pub/sub mismatch — publisher side (Issue #45).
#
# Pairs with `manifest_qos_match_pubsub_sub`. The publisher offers
# `best_effort` on `/sensor/data`. The subscriber in the sibling scope
# requests `reliable` via per-endpoint override. After cross-scope merge
# the qos-match rule should emit a `reliability` incompatibility error.
version: 1

nodes:
  lidar_driver:
    pub:
      data:
        min_rate_hz: 10

topics:
  /sensor/data:
    type: sensor_msgs/msg/PointCloud2
    pub: [lidar_driver/data]
    rate_hz: 10
    qos:
      reliability: best_effort
