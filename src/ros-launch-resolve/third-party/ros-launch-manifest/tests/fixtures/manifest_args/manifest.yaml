# Test fixture: manifest with args and $(var ...) substitutions.
# All args are mandatory — values provided by scope args at check time.
args:
  input_topic:
  output_topic:
  node_enabled:

version: 1

nodes:
  processor:
    sub: [input]
    pub: [output]

topics:
  input_data:
    type: $(var input_topic)
    pub: []
    sub: [processor/input]
  output_data:
    type: $(var output_topic)
    pub: [processor/output]
    sub: []
