version: 1
chains:
  ok_chain:
    semantics: reaction
    max_latency_ms: 100
    segments:
      - { scope: /a, path: make }
      - { via: /link/out }
      - { scope: /b, path: consume }
  broken_via_chain:
    semantics: reaction
    max_latency_ms: 100
    segments:
      - { scope: /a, path: make }
      - { via: /link/nonexistent }
      - { scope: /b, path: consume }
  budget_blown_chain:
    semantics: reaction
    max_latency_ms: 10
    segments:
      - { scope: /a, path: make }
      - { via: /link/out }
      - { scope: /b, path: consume }
  sampling_infeasible_chain:
    semantics: reaction
    max_latency_ms: 50
    segments:
      - { scope: /a, path: make_slow }
      - { via: /link/out2 }
      - { scope: /b, path: consume2 }
  # via topic EXISTS (/link/out) but the preceding segment (make_slow)
  # outputs /link/out2, not /link/out — "not output by preceding" error.
  # The following segment (consume) does consume /link/out, so only the
  # output-side check fires. Budget generous so no budget warnings mix in.
  via_not_output_chain:
    semantics: reaction
    max_latency_ms: 5000
    segments:
      - { scope: /a, path: make_slow }
      - { via: /link/out }
      - { scope: /b, path: consume }
  # via topic EXISTS (/link/out) and IS output by the preceding segment
  # (make), but the following segment (consume2) consumes /link/out2 —
  # "not consumed by following" error only.
  via_not_consumed_chain:
    semantics: reaction
    max_latency_ms: 5000
    segments:
      - { scope: /a, path: make }
      - { via: /link/out }
      - { scope: /b, path: consume2 }
