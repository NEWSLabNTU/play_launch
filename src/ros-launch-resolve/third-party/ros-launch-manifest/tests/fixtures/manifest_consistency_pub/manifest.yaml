# Publisher side of a cross-scope topic.
# Declares full contract (type + rate_hz).
version: 1

nodes:
  source:
    pub:
      out:
        min_rate_hz: 10

topics:
  shared_data:
    type: std_msgs/msg/String
    pub: [source/out]
    rate_hz: 10
    qos:
      reliability: reliable
      durability: volatile
