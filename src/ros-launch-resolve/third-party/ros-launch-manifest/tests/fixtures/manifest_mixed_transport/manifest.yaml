# Mixed-transport critical path (Issue #44).
#
# Topology:
#         ┌→ lidar_detector (50ms) ──[intra-process: 0ms]──┐
#  in →   │                                                ├→ fusion (20ms) → out
#         └→ camera_detector (30ms) ──[network: 10ms]──────┘
#
# Topic-level max_transport_ms: 10ms (worst-case default).
# Override on fusion/lidar: 0ms (intra-process collocation).
#
# Critical path with override:
#   lidar branch:  50 + 0  + 20 = 70
#   camera branch: 30 + 10 + 20 = 60
#   max = 70ms
#
# Critical path without endpoint override (topic default applied to both):
#   lidar branch:  50 + 10 + 20 = 80
#   camera branch: 30 + 10 + 20 = 60
#   max = 80ms
#
# The override reflects deployment reality (lidar collocated with fusion
# while camera arrives over a network bridge). Without it the budget
# would be inflated by 10ms of phantom transport.
version: 1

nodes:
  lidar_detector:
    sub:
      input: { min_rate_hz: 10 }
    pub:
      out: { min_rate_hz: 10 }
    paths:
      main:
        input: input
        output: [out]
        max_latency_ms: 50

  camera_detector:
    sub:
      input: { min_rate_hz: 10 }
    pub:
      out: { min_rate_hz: 10 }
    paths:
      main:
        input: input
        output: [out]
        max_latency_ms: 30

  fusion:
    sub:
      lidar:
        min_rate_hz: 10
        max_transport_ms: 0     # intra-process from lidar_detector
      camera:
        min_rate_hz: 10
        # Inherits topic default (10ms) — cross-network bridge
    pub:
      out: { min_rate_hz: 10 }
    paths:
      main:
        input: [lidar, camera]
        output: [out]
        correlation: timestamp
        tolerance_ms: 50
        max_latency_ms: 20

topics:
  /sensor/raw:
    type: sensor_msgs/msg/PointCloud2
    sub: [lidar_detector/input, camera_detector/input]
    rate_hz: 10

  /perception/lidar_objects:
    type: autoware_perception_msgs/msg/DetectedObjects
    pub: [lidar_detector/out]
    sub: [fusion/lidar]
    rate_hz: 10
    max_transport_ms: 10

  /perception/camera_objects:
    type: autoware_perception_msgs/msg/DetectedObjects
    pub: [camera_detector/out]
    sub: [fusion/camera]
    rate_hz: 10
    max_transport_ms: 10

  /perception/fused_objects:
    type: autoware_perception_msgs/msg/DetectedObjects
    pub: [fusion/out]
    rate_hz: 10

paths:
  pipeline:
    input: /sensor/raw
    output: [/perception/fused_objects]
    max_latency_ms: 70
