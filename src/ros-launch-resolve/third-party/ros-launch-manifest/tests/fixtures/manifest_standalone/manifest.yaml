# Standalone validation fixture.
#
# This manifest declares a subscriber-only topic with its `type`, so it
# validates without needing a cross-scope merge to know the message
# type. When checked standalone, the `consistency` rule has nothing to
# check (no conflicting declarations), and the subscriber-side type
# is sufficient for per-manifest rules like qos-compat.
#
# When merged with a publisher manifest declaring the same topic, the
# checker verifies type agreement and wires up pub/sub for the graph
# traversal.
version: 1

nodes:
  consumer:
    sub:
      odometry:
        min_rate_hz: 50
        max_age_ms: 100

topics:
  # Absolute — subscribes to a topic from a different subsystem.
  # Declares `type` so this manifest is self-contained for standalone
  # checking, even though no publisher is present locally.
  /localization/kinematic_state:
    type: nav_msgs/msg/Odometry
    sub: [consumer/odometry]
    qos:
      reliability: reliable
      durability: volatile
