# Cross-scope QoS pub/sub mismatch — subscriber side (Issue #45).
#
# Companion to `manifest_qos_match_pubsub_pub`. The subscriber requires
# `reliable` reliability via a per-endpoint override; the matching
# publisher in the sibling scope offers `best_effort`. The cross-scope
# qos-match check should report this as an error after merge.
version: 1

nodes:
  perception:
    sub:
      data:
        min_rate_hz: 10
        qos:
          reliability: reliable

topics:
  /sensor/data:
    type: sensor_msgs/msg/PointCloud2
    sub: [perception/data]
    rate_hz: 10
