# Timer-driven node: controller reads state topics and publishes periodically.
# Tests: periodic paths (empty input = timer-driven), state endpoints, rate chain.
version: 1

nodes:
  localization:
    pub:
      current_pose:
        min_rate_hz: 50
    paths:
      periodic:
        input: []
        output: [current_pose]
        max_latency_ms: 2

  trajectory_planner:
    sub:
      current_pose:
        state: true
      route:
        state: true
        required: true
    pub:
      trajectory:
        min_rate_hz: 10
    paths:
      periodic:
        input: []
        output: [trajectory]
        max_latency_ms: 30

  controller:
    sub:
      trajectory:
        state: true
      current_velocity:
        state: true
    pub:
      control_cmd:
        min_rate_hz: 30
    paths:
      periodic:
        input: []
        output: [control_cmd]
        max_latency_ms: 5

topics:
  current_pose:
    type: geometry_msgs/msg/PoseStamped
    pub: [localization/current_pose]
    sub: [trajectory_planner/current_pose]
    rate_hz: 50
    qos:
      reliability: reliable

  route:
    type: autoware_msgs/msg/Route
    pub: []
    sub: [trajectory_planner/route]
    qos:
      reliability: reliable
      durability: transient_local

  trajectory:
    type: autoware_msgs/msg/Trajectory
    pub: [trajectory_planner/trajectory]
    sub: [controller/trajectory]
    rate_hz: 10
    qos:
      reliability: reliable

  current_velocity:
    type: geometry_msgs/msg/TwistStamped
    pub: []
    sub: [controller/current_velocity]
    rate_hz: 50
    qos:
      reliability: best_effort

  control_cmd:
    type: autoware_msgs/msg/ControlCommand
    pub: [controller/control_cmd]
    sub: []
    rate_hz: 30

