# Intentional violations — every rule should trigger at least one diagnostic.
#
# Expected violations:
#   [error]   qos-compat        — invalid durability "persistent"
#   [error]   rate-hierarchy     — pub min_rate_hz (5) < topic rate_hz (10)
#   [error]   rate-hierarchy     — topic rate_hz (8) < subscriber min_rate_hz (15)
#   [error]   causal-dag         — cycle between node_a and node_b
#   [error]   drop-sanity        — drop count N > window W (or other sanity issues)
#   [warning] scope-budget       — scope latency may be less than sum of node latencies
#   [warning] wiring             — path endpoint not wired by any topic
version: 1

nodes:
  slow_driver:
    pub:
      sensor:
        min_rate_hz: 5
    paths:
      main:
        input: input
        output: [sensor]
        max_latency_ms: 40

  node_a:
    sub:
      from_b: {}
      input: {}
    pub:
      to_b: {}
    paths:
      main:
        input: input
        output: [to_b]
        max_latency_ms: 25
        drop:
          max_count: 5 / 100
          max_consecutive: 5

  node_b:
    sub:
      from_a: {}
    pub:
      to_a: {}
      output: {}
    paths:
      main:
        input: from_a
        output: [to_a, output]
        max_latency_ms: 25
        drop:
          max_count: 5 / 100
          max_consecutive: 4

  greedy_consumer:
    sub:
      data:
        min_rate_hz: 15
    paths:
      main:
        input: data
        output: []
        max_latency_ms: 10

  unwired_node:
    sub: [lonely_input]
    pub: [lonely_output]
    paths:
      dangling:
        input: lonely_input
        output: [lonely_output]
        max_latency_ms: 10

  # Service violation: client with no matching server
  orphan_client:
    cli:
      missing_service: {}

topics:
  sensor_data:
    type: sensor_msgs/msg/PointCloud2
    pub: [slow_driver/sensor]
    sub: [node_a/input]
    rate_hz: 10
    qos:
      reliability: best_effort
      durability: persistent

  a_to_b:
    type: std_msgs/msg/String
    pub: [node_a/to_b]
    sub: [node_b/from_a]

  b_to_a:
    type: std_msgs/msg/String
    pub: [node_b/to_a]
    sub: [node_a/from_b]

  output_topic:
    type: std_msgs/msg/Float64
    pub: [node_b/output]
    sub: [greedy_consumer/data]
    rate_hz: 8

# Service violation: no type declared
services:
  typeless_service:
    server: [node_a/to_b]

paths:
  main:
    input: raw
    output: [results]
    max_latency_ms: 100
    drop:
      max_count: 3 / 100
      max_consecutive: 2
