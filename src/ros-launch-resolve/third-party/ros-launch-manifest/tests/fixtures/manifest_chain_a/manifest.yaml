version: 1
nodes:
  producer:
    pub:
      out: {}
      out2: {}
    paths:
      make:
        trigger: spontaneous
        output: [out]
        max_latency_ms: 40
      make_slow:
        trigger: { timer: { rate_hz: 1 } }
        output: [out2]
        max_latency_ms: 5
topics:
  /link/out:
    type: t
    pub: [producer/out]
  /link/out2:
    type: t
    pub: [producer/out2]
