[package]
name = "ros-launch-manifest-model"
version.workspace = true
edition.workspace = true
description = "SystemModel — the resolved, checked system artifact shared by play_launch (Linux runtime) and nano-ros (embedded build)"
license.workspace = true
repository.workspace = true

[dependencies]
indexmap = { version = "2", features = ["serde"] }
ros-launch-manifest-sched = { path = "../sched" }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
toml = "0.8"
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
