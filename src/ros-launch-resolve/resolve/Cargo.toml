# The resolve pipeline: LaunchDump -> manifests -> SystemModel -> schedule.
#
# Lifted from play_launch's `ros/` module with history preserved. Depends on
# the spec layer and the launch parser; deliberately NOT on rclrs, generated
# messages, or anything requiring colcon.
[package]
name = "ros-launch-resolve"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Resolve a ROS 2 launch tree into a checked SystemModel"

[features]
# Forwarded to the checker (rlm v0.1.8). Default ON: `play_launch resolve`
# and this crate's own consumers keep the full 21-rule battery, z3 included.
# A distribution that wants no z3/bindgen host deps opts out with
# `default-features = false` and gets the checker's own Info diagnostic in
# every model's meta.diagnostics instead of a silent gap.
default = ["smt"]
smt = ["ros-launch-manifest-check/smt"]

[dependencies]
# issue 0382 — `structure.nodes` is an order-preserving map.
indexmap = { version = "2", features = ["serde"] }
ros-launch-manifest-types = { workspace = true }
ros-launch-manifest-model = { workspace = true }
ros-launch-manifest-sched = { workspace = true }
ros-launch-manifest-check = { workspace = true }
play_launch_parser = { workspace = true }
# The Python half of the parser (nano-ros issue 0897 W2b). Depending
# on it HERE is the choice to link libpython: `.launch.py` files and
# `$(eval ...)` are Python by ROS 2 specification, and this crate
# resolves both. Without it the parser reports PythonUnavailable for
# those two. W3 makes this a runtime dlopen instead; until then it is
# a normal dependency and nothing about the shipped binary changes.
# The LOADER, not the Python half (0897 W3). Depending on `pyexec`
# directly is what put `libpython3.10.so.1.0` in this binary's
# DT_NEEDED and pinned it to one interpreter; `pyload` discovers one
# at runtime and dlopens it instead, so one build serves any CPython
# >= the abi3 floor and a host without one gets an error VALUE.
play_launch_parser_pyload = { path = "../parser/crates/pyload" }
log = "0.4"
eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
# Only `runtime::Builder::new_multi_thread` and `task::spawn_blocking` are
# used, both of which `rt-multi-thread` provides. `process`, `io-util`,
# `macros`, `sync` and `time` were never referenced; each drags its own
# transitive tree (mio, socket2, signal-hook-registry) into every consumer.
tokio = { version = "1", features = ["rt-multi-thread"] }
# `verbs::build_tokio_runtime` sizes the worker pool from the CPU count, so the
# same verb adapts to a 2-core Pi and a 32-core server.
num_cpus = "1"
chrono = "0.4"
# ValueEnum only — the pipeline branches on these modes, so they live with the
# pipeline rather than in a consumer's option types.
clap = { version = "4", features = ["derive"] }
sha2 = { workspace = true }
# `.launch.py` executes against the USER's interpreter — the one external
# requirement of this layer, and the reason it is a separate process from the
# portable consumers that link it.
pyo3 = { version = "0.29", features = ["auto-initialize", "py-clone"] }

[dev-dependencies]
tempfile = "3"
# `testdata` exposes `ros_launch_manifest_check::fixture_dir()`. The tests
# below build real ManifestIndexes from 24 fixture packages that live in the
# manifest repository; since phase-55 W2 made that a git dependency, only the
# owning crate can name their path. Dev-only, so the feature never reaches a
# non-test build.
ros-launch-manifest-check = { workspace = true, features = ["testdata"] }
